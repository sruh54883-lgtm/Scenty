<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E37A3">
<title>Scenti — Панель агента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0E37A3;
  --light:#2E7BD6;
  --bg:#f0f4fb;
  --card:#ffffff;
  --text:#16233F;
  --muted:#7C8BA5;
  --success:#1ec27f;
  --danger:#D5564B;
  --warning:#F1A82C;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(14,55,163,.08);
  --shadow-soft:0 2px 10px rgba(22,35,63,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.45;
  display:flex;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 40px rgba(22,35,63,.06);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px;color:var(--text)}
input:focus,textarea:focus{outline:none}
::placeholder{color:var(--muted);opacity:.85}

/* ---------- LOGIN ---------- */
.login-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:linear-gradient(160deg,#0E37A3 0%,#2E7BD6 100%);
}
.login-card{
  width:100%;max-width:360px;background:var(--card);
  border-radius:26px;padding:36px 28px;
  box-shadow:0 20px 50px rgba(8,28,90,.35);
  text-align:center;
}
.logo{
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:42px;color:var(--primary);letter-spacing:-1px;line-height:1;
}
.login-sub{color:var(--muted);font-weight:500;margin-top:6px;margin-bottom:28px;font-size:15px}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:7px}
.input{
  width:100%;background:var(--bg);border:1.5px solid transparent;
  border-radius:var(--radius-sm);padding:14px 16px;transition:border-color .2s,background .2s;
}
.input:focus{border-color:var(--light);background:#fff}
.input-icon{position:relative}
.input-icon svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input-icon .input{padding-left:44px}
.btn{
  width:100%;background:var(--primary);color:#fff;font-weight:700;font-size:16px;
  border-radius:var(--radius-sm);padding:15px;transition:transform .12s,background .2s,box-shadow .2s;
  box-shadow:0 8px 18px rgba(14,55,163,.28);
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;box-shadow:none}
.btn-light{background:#fff;color:var(--primary);border:1.5px solid #e2e9f5;box-shadow:none}
.btn-danger{background:var(--danger);box-shadow:0 8px 18px rgba(213,86,75,.28)}
.btn-success{background:var(--success);box-shadow:0 8px 18px rgba(30,194,127,.28)}
.login-err{color:var(--danger);font-size:13px;font-weight:600;margin-top:14px;min-height:18px}

/* ---------- SHELL ---------- */
.shell{flex:1;display:none;flex-direction:column;min-height:100vh}
.shell.active{display:flex}
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--card);padding:18px 20px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-soft);
}
.topbar .logo-sm{font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;color:var(--primary);line-height:1}
.topbar h1{font-size:18px;font-weight:700}
.topbar .back-btn{
  display:flex;align-items:center;gap:5px;font-weight:600;color:var(--primary);font-size:15px;
}
.content{flex:1;padding:18px 18px 100px;overflow-y:auto}

/* views */
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* search */
.search-wrap{position:relative;margin-bottom:18px}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-input{
  width:100%;background:var(--card);border:1.5px solid transparent;
  border-radius:var(--radius);padding:15px 16px 15px 46px;box-shadow:var(--shadow-soft);
  transition:border-color .2s;
}
.search-input:focus{border-color:var(--light)}

/* client card */
.client-card{
  background:var(--card);border-radius:var(--radius);padding:14px;
  display:flex;align-items:center;gap:13px;margin-bottom:12px;
  box-shadow:var(--shadow-soft);transition:transform .12s,box-shadow .2s;
}
.client-card:active{transform:scale(.98);box-shadow:var(--shadow)}
.avatar{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(150deg,var(--light),var(--primary));
  color:#fff;font-weight:700;font-size:17px;
  display:flex;align-items:center;justify-content:center;
}
.client-info{flex:1;min-width:0}
.client-info .name{font-weight:700;font-size:15.5px}
.client-info .biz{color:var(--text);opacity:.7;font-size:13px;font-weight:500}
.client-info .phone{color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;margin-top:1px}
.chev{color:var(--muted);flex-shrink:0}

.empty{text-align:center;color:var(--muted);padding:48px 20px;font-weight:500}
.empty .em-ico{font-size:38px;margin-bottom:10px}
.skeleton{background:var(--card);border-radius:var(--radius);height:76px;margin-bottom:12px;
  background:linear-gradient(90deg,#fff 25%,#eef2f9 50%,#fff 75%);background-size:200% 100%;
  animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* client detail */
.detail-head{
  background:var(--card);border-radius:var(--radius);padding:22px;margin-bottom:18px;
  box-shadow:var(--shadow);text-align:center;
}
.detail-head .avatar{width:64px;height:64px;border-radius:18px;font-size:22px;margin:0 auto 14px}
.detail-head .name{font-size:20px;font-weight:800}
.detail-head .biz{color:var(--light);font-weight:600;font-size:14px;margin-top:2px}
.detail-rows{margin-top:16px;text-align:left;border-top:1px solid #eef2f9;padding-top:14px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.detail-row .k{color:var(--muted);font-weight:500}
.detail-row .v{font-weight:600;text-align:right}

/* sale form */
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-soft);margin-bottom:16px}
.card-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-sub{color:var(--muted);font-weight:500;font-size:14px;margin-bottom:18px}
.amount-input{
  width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:16px;font-size:24px;font-weight:800;text-align:center;letter-spacing:.5px;
}
.amount-input:focus{border-color:var(--light);background:#fff}
.hint{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:7px;text-align:center}
.cashback-box{
  background:linear-gradient(135deg,rgba(30,194,127,.12),rgba(30,194,127,.04));
  border:1.5px solid rgba(30,194,127,.25);border-radius:var(--radius-sm);
  padding:14px 16px;margin:16px 0;text-align:center;
}
.cashback-box .lbl{color:#13955f;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.cashback-box .val{color:var(--success);font-size:24px;font-weight:800;margin-top:3px}
textarea.note{
  width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:13px 15px;resize:none;min-height:74px;transition:border-color .2s;
}
textarea.note:focus{border-color:var(--light);background:#fff}

/* stats */
.stats-card{
  background:linear-gradient(150deg,var(--primary),var(--light));
  border-radius:var(--radius);padding:20px;color:#fff;margin-bottom:20px;
  box-shadow:0 12px 28px rgba(14,55,163,.25);
}
.stats-card .lbl{font-size:13px;font-weight:600;opacity:.85}
.stats-grid{display:flex;gap:14px;margin-top:14px}
.stat{flex:1}
.stat .n{font-size:24px;font-weight:800;line-height:1.1}
.stat .t{font-size:12.5px;opacity:.85;font-weight:500;margin-top:2px}

/* transaction card */
.tx-card{
  background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  box-shadow:var(--shadow-soft);
}
.tx-top{display:flex;align-items:flex-start;gap:12px}
.tx-ico{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:rgba(46,123,214,.12);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.tx-mid{flex:1;min-width:0}
.tx-mid .name{font-weight:700;font-size:15px}
.tx-mid .date{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:1px}
.tx-amt{text-align:right;flex-shrink:0}
.tx-amt .a{font-weight:800;font-size:15px}
.tx-amt .cb{color:var(--success);font-size:12.5px;font-weight:600;margin-top:1px}
.tx-foot{display:flex;justify-content:flex-end;margin-top:10px}
.tx-note{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:8px;padding-top:8px;border-top:1px dashed #e7edf6}
.pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:30px}
.pill.pending{background:rgba(241,168,44,.15);color:#C7851A}
.pill.approved{background:rgba(30,194,127,.15);color:#0f9a63}
.pill.rejected{background:rgba(213,86,75,.15);color:var(--danger)}

/* profile */
.profile-head{
  background:var(--card);border-radius:var(--radius);padding:24px;text-align:center;
  box-shadow:var(--shadow);margin-bottom:18px;
}
.profile-head .avatar{width:72px;height:72px;border-radius:20px;font-size:26px;margin:0 auto 14px}
.profile-head .name{font-size:20px;font-weight:800}
.profile-head .phone{color:var(--muted);font-weight:500;margin-top:2px}
.section-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 4px 10px}
.district{
  background:var(--card);border-radius:var(--radius-sm);padding:13px 16px;margin-bottom:9px;
  font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-soft);
}
.district .dot{width:8px;height:8px;border-radius:50%;background:var(--light);flex-shrink:0}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--card);
  display:flex;padding:8px 8px env(safe-area-inset-bottom);
  box-shadow:0 -4px 20px rgba(22,35,63,.08);z-index:40;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px 10px;color:var(--muted);font-size:11px;font-weight:600;transition:color .2s;
}
.nav-item svg{width:23px;height:23px}
.nav-item.active{color:var(--primary)}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(16,28,55,.45);z-index:60;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex;animation:fade .2s}
.modal{
  width:100%;max-width:480px;background:var(--card);
  border-radius:26px 26px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom));
  animation:slideUp .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-grip{width:42px;height:5px;border-radius:5px;background:#dde4f0;margin:0 auto 18px}

/* toast */
.toast-wrap{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:90;width:calc(100% - 36px);max-width:444px;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  background:var(--text);color:#fff;border-radius:14px;padding:14px 16px;
  font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:10px;animation:toastIn .3s cubic-bezier(.2,.8,.2,1);
}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.fade-out{animation:toastOut .3s forwards}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}

.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.mt8{margin-top:8px}
</style>
</head>
<body>
<div id="app">

  <!-- ============ LOGIN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="logo">scenti</div>
      <div class="login-sub">Панель агента</div>
      <form id="loginForm">
        <div class="field">
          <label>Логин</label>
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" id="loginUser" type="text" placeholder="username" autocomplete="username" required>
          </div>
        </div>
        <div class="field">
          <label>Пароль</label>
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>
        <button class="btn" type="submit" id="loginBtn">Войти</button>
        <div class="login-err" id="loginErr"></div>
      </form>
    </div>
  </div>

  <!-- ============ SHELL ============ -->
  <div class="shell" id="shell">
    <div class="topbar" id="topbar"></div>
    <div class="content">

      <!-- VIEW: clients list -->
      <div class="view" id="view-clients">
        <div class="search-wrap">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="search-input" id="searchInput" type="text" placeholder="Поиск по имени или телефону">
        </div>
        <div id="clientsList"></div>
      </div>

      <!-- VIEW: client detail -->
      <div class="view" id="view-client"></div>

      <!-- VIEW: transactions -->
      <div class="view" id="view-tx">
        <div class="stats-card">
          <div class="lbl">Этот месяц</div>
          <div class="stats-grid">
            <div class="stat"><div class="n" id="statCount">0</div><div class="t">Транзакций</div></div>
            <div class="stat"><div class="n" id="statSum">0</div><div class="t">Сумма, сум</div></div>
          </div>
        </div>
        <div id="txList"></div>
      </div>

      <!-- VIEW: profile -->
      <div class="view" id="view-profile"></div>

    </div>

    <!-- bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Клиенты
      </button>
      <button class="nav-item" data-tab="tx">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        Транзакции
      </button>
      <button class="nav-item" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Профиль
      </button>
    </nav>
  </div>

  <!-- toast container -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- sale modal -->
  <div class="modal-overlay" id="saleModal"></div>

</div>

<script>
/* ===================== CONFIG ===================== */
const API_BASE = 'http://localhost:8000';
const LS_TOKEN = 'scenti_agent_token';
const LS_AGENT = 'scenti_agent_profile';
let USE_MOCK = false;

/* ===================== MOCK ===================== */
const MOCK = {
  agent:{name:'Азиз Каримов',phone:'+998 90 123 45 67',districts:['Чиланзар','Юнусабад','Мирзо-Улугбек']},
  users:[
    {id:1,name:'Дилшод Рахимов',business:'Кафе "Лаззат"',phone:'+998 90 111 22 33',region:'Чиланзар'},
    {id:2,name:'Малика Усманова',business:'Салон "Гулдаста"',phone:'+998 93 444 55 66',region:'Юнусабад'},
  ],
  tx:[
    {id:101,user_name:'Дилшод Рахимов',amount:500000,cashback:50000,note:'2 диффузора',status:'approved',created_at:'2026-06-27T10:30:00'},
    {id:102,user_name:'Малика Усманова',amount:1200000,cashback:120000,note:'Набор ароматов',status:'pending',created_at:'2026-06-26T14:10:00'},
    {id:103,user_name:'Дилшод Рахимов',amount:300000,cashback:30000,note:'',status:'rejected',created_at:'2026-06-20T09:00:00'},
  ]
};

/* ===================== STATE ===================== */
let state = {tab:'clients', clientStack:false, currentClient:null, txCache:null};

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const token = () => localStorage.getItem(LS_TOKEN);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const fmtNum = n => {const v=Math.round(Number(n)||0);return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');};
const fmtSum = n => fmtNum(n)+' сум';
const MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtDate(iso){const d=new Date(iso);if(isNaN(d))return '';return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}

function toast(msg,type='',ms=3200){
  const wrap=$('#toastWrap');
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=esc(msg);
  wrap.appendChild(el);
  setTimeout(()=>{el.classList.add('fade-out');setTimeout(()=>el.remove(),300);},ms);
}

/* ===================== API ===================== */
async function api(path,{method='GET',body=null}={}){
  const headers={'Content-Type':'application/json'};
  if(token()) headers['Authorization']='Bearer '+token();
  const res=await fetch(API_BASE+path,{method,headers,body:body?JSON.stringify(body):null});
  if(res.status===401){doLogout();throw new Error('401');}
  if(!res.ok){let m='Ошибка сервера';try{const j=await res.json();m=j.detail||j.message||m;}catch(e){}throw new Error(m);}
  if(res.status===204)return null;
  return res.json();
}

/* ===================== AUTH ===================== */
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('#loginBtn'),err=$('#loginErr');
  err.textContent='';
  const username=$('#loginUser').value.trim();
  const password=$('#loginPass').value;
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    const data=await api('/auth/agent/login',{method:'POST',body:{username,password}});
    localStorage.setItem(LS_TOKEN,data.token||data.access_token);
    if(data.agent) localStorage.setItem(LS_AGENT,JSON.stringify(data.agent));
    enterApp();
  }catch(ex){
    // fallback to mock for offline/demo
    if(ex.message==='Failed to fetch'||/NetworkError|fetch/i.test(ex.message)){
      USE_MOCK=true;
      localStorage.setItem(LS_TOKEN,'mock-token');
      localStorage.setItem(LS_AGENT,JSON.stringify(MOCK.agent));
      toast('Демо-режим (API недоступен)','',2600);
      enterApp();
    }else{
      err.textContent=ex.message||'Не удалось войти';
    }
  }finally{
    btn.disabled=false;btn.textContent='Войти';
  }
});

function doLogout(){
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_AGENT);
  state={tab:'clients',clientStack:false,currentClient:null,txCache:null};
  $('#shell').classList.remove('active');
  $('#loginScreen').style.display='flex';
}

/* ===================== APP ENTRY ===================== */
function enterApp(){
  $('#loginScreen').style.display='none';
  $('#shell').classList.add('active');
  switchTab('clients');
}

/* ===================== NAV ===================== */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
});

function setActiveNav(tab){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#'+id).classList.add('active');
}

function setTopbar(html){$('#topbar').innerHTML=html;}

function switchTab(tab){
  state.tab=tab;state.clientStack=false;
  setActiveNav(tab);
  if(tab==='clients'){
    setTopbar('<span class="logo-sm">scenti</span><h1 style="font-size:16px;font-weight:600;color:var(--muted)">Клиенты</h1>');
    showView('view-clients');
    if(!$('#clientsList').dataset.loaded) loadClients('');
  }else if(tab==='tx'){
    setTopbar('<h1>Мои транзакции</h1>');
    showView('view-tx');
    loadTransactions();
  }else if(tab==='profile'){
    setTopbar('<h1>Профиль</h1>');
    showView('view-profile');
    renderProfile();
  }
}

/* ===================== CLIENTS ===================== */
let searchTimer=null;
$('#searchInput').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  const q=e.target.value.trim();
  searchTimer=setTimeout(()=>loadClients(q),400);
});

function skeletons(n){let h='';for(let i=0;i<n;i++)h+='<div class="skeleton"></div>';return h;}

async function loadClients(search){
  const list=$('#clientsList');
  list.dataset.loaded='1';
  list.innerHTML=skeletons(3);
  try{
    let users;
    if(USE_MOCK){
      const q=search.toLowerCase();
      users=MOCK.users.filter(u=>!q||u.name.toLowerCase().includes(q)||u.phone.includes(q));
    }else{
      const data=await api('/agent/users?search='+encodeURIComponent(search));
      users=Array.isArray(data)?data:(data.users||data.results||[]);
    }
    renderClients(users,search);
  }catch(ex){
    if(ex.message==='401')return;
    list.innerHTML=`<div class="empty"><div class="em-ico">⚠️</div>${esc(ex.message)}</div>`;
  }
}

function renderClients(users,search){
  const list=$('#clientsList');
  if(!users.length){
    list.innerHTML=`<div class="empty"><div class="em-ico">🔍</div>${search?'Клиенты не найдены':'Начните поиск клиента'}</div>`;
    return;
  }
  list.innerHTML=users.map(u=>`
    <div class="client-card" data-id="${u.id}">
      <div class="avatar">${esc(initials(u.name))}</div>
      <div class="client-info">
        <div class="name">${esc(u.name)}</div>
        <div class="biz">${esc(u.business||u.biz||'')}</div>
        <div class="phone">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ${esc(u.phone)}
        </div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </div>`).join('');
  list.querySelectorAll('.client-card').forEach(c=>{
    c.addEventListener('click',()=>{
      const u=users.find(x=>String(x.id)===c.dataset.id);
      openClient(u);
    });
  });
}

/* ===================== CLIENT DETAIL ===================== */
function openClient(u){
  state.currentClient=u;state.clientStack=true;
  setTopbar('<button class="back-btn" id="backBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Назад</button>');
  $('#backBtn').addEventListener('click',()=>switchTab('clients'));
  const v=$('#view-client');
  v.innerHTML=`
    <div class="detail-head">
      <div class="avatar">${esc(initials(u.name))}</div>
      <div class="name">${esc(u.name)}</div>
      <div class="biz">${esc(u.business||u.biz||'')}</div>
      <div class="detail-rows">
        <div class="detail-row"><span class="k">Телефон</span><span class="v">${esc(u.phone)}</span></div>
        <div class="detail-row"><span class="k">Регион</span><span class="v">${esc(u.region||'—')}</span></div>
        <div class="detail-row"><span class="k">Бизнес</span><span class="v">${esc(u.business||u.biz||'—')}</span></div>
      </div>
    </div>
    <button class="btn" id="saleBtn">+ Внести продажу</button>
  `;
  $('#saleBtn').addEventListener('click',()=>openSaleModal(u));
  showView('view-client');
}

/* ===================== SALE MODAL ===================== */
function openSaleModal(u){
  const m=$('#saleModal');
  m.innerHTML=`
    <div class="modal">
      <div class="modal-grip"></div>
      <div class="card-title">💰 Новая продажа</div>
      <div class="card-sub">Клиент: <b style="color:var(--text)">${esc(u.name)}</b></div>

      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:8px">Сумма покупки (сум)</label>
      <input class="amount-input" id="saleAmount" inputmode="numeric" placeholder="0">
      <div class="hint">Введите сумму, которую получили на руки</div>

      <div class="cashback-box">
        <div class="lbl">Кешбэк клиента · 10%</div>
        <div class="val" id="cashbackVal">0 сум</div>
      </div>

      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:8px">Заметка (опционально)</label>
      <textarea class="note" id="saleNote" placeholder="Напр.: 2 диффузора + набор"></textarea>

      <button class="btn btn-success mt8" id="saleSubmit" style="margin-top:18px">Отправить на подтверждение</button>
      <button class="btn btn-light" id="saleCancel" style="margin-top:10px">Отмена</button>
    </div>`;
  m.classList.add('show');

  const amountEl=$('#saleAmount'),cbEl=$('#cashbackVal');
  amountEl.addEventListener('input',()=>{
    let digits=amountEl.value.replace(/\D/g,'');
    amountEl.value=digits?fmtNum(digits):'';
    const amt=Number(digits)||0;
    cbEl.textContent=fmtSum(Math.round(amt*0.1));
  });
  setTimeout(()=>amountEl.focus(),300);

  $('#saleCancel').addEventListener('click',closeSaleModal);
  m.addEventListener('click',e=>{if(e.target===m)closeSaleModal();});

  $('#saleSubmit').addEventListener('click',async()=>{
    const amount=Number(amountEl.value.replace(/\D/g,''))||0;
    const note=$('#saleNote').value.trim();
    if(amount<=0){toast('Введите сумму покупки','error');return;}
    const btn=$('#saleSubmit');
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    try{
      if(USE_MOCK){
        await new Promise(r=>setTimeout(r,600));
        MOCK.tx.unshift({id:Date.now(),user_name:u.name,amount,cashback:Math.round(amount*0.1),note,status:'pending',created_at:new Date().toISOString()});
      }else{
        await api('/agent/transactions',{method:'POST',body:{user_id:u.id,amount,note}});
      }
      closeSaleModal();
      toast('✅ Отправлено! Ожидает подтверждения супер-админа','success',4200);
      setTimeout(()=>toast(`Кешбэк ${fmtSum(Math.round(amount*0.1))} будет начислен после подтверждения`,'',4200),400);
    }catch(ex){
      if(ex.message!=='401')toast(ex.message||'Ошибка отправки','error');
      btn.disabled=false;btn.textContent='Отправить на подтверждение';
    }
  });
}
function closeSaleModal(){const m=$('#saleModal');m.classList.remove('show');m.innerHTML='';}

/* ===================== TRANSACTIONS ===================== */
async function loadTransactions(){
  const list=$('#txList');
  list.innerHTML=skeletons(3);
  try{
    let tx;
    if(USE_MOCK){await new Promise(r=>setTimeout(r,400));tx=MOCK.tx.slice();}
    else{const data=await api('/agent/transactions');tx=Array.isArray(data)?data:(data.transactions||data.results||[]);}
    renderTransactions(tx);
  }catch(ex){
    if(ex.message==='401')return;
    list.innerHTML=`<div class="empty"><div class="em-ico">⚠️</div>${esc(ex.message)}</div>`;
  }
}

const STATUS={
  pending:{cls:'pending',label:'Ожидает'},
  approved:{cls:'approved',label:'Подтверждено'},
  confirmed:{cls:'approved',label:'Подтверждено'},
  rejected:{cls:'rejected',label:'Отклонено'},
  declined:{cls:'rejected',label:'Отклонено'},
};

function renderTransactions(tx){
  // stats this month
  const now=new Date();
  const monthTx=tx.filter(t=>{const d=new Date(t.created_at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  $('#statCount').textContent=monthTx.length;
  $('#statSum').textContent=fmtNum(monthTx.reduce((s,t)=>s+(Number(t.amount)||0),0));

  const list=$('#txList');
  if(!tx.length){list.innerHTML='<div class="empty"><div class="em-ico">🧾</div>Пока нет транзакций</div>';return;}
  list.innerHTML=tx.map(t=>{
    const st=STATUS[t.status]||{cls:'pending',label:t.status||'—'};
    const cb=t.cashback!=null?t.cashback:Math.round((Number(t.amount)||0)*0.1);
    const name=t.user_name||t.client_name||t.name||'Клиент';
    return `
    <div class="tx-card">
      <div class="tx-top">
        <div class="tx-ico">🛍️</div>
        <div class="tx-mid">
          <div class="name">${esc(name)}</div>
          <div class="date">${esc(fmtDate(t.created_at))}</div>
        </div>
        <div class="tx-amt">
          <div class="a">${fmtSum(t.amount)}</div>
          <div class="cb">Кешбэк: ${fmtNum(cb)}</div>
        </div>
      </div>
      ${t.note?`<div class="tx-note">📝 ${esc(t.note)}</div>`:''}
      <div class="tx-foot"><span class="pill ${st.cls}">${esc(st.label)}</span></div>
    </div>`;
  }).join('');
}

/* ===================== PROFILE ===================== */
function renderProfile(){
  let a;try{a=JSON.parse(localStorage.getItem(LS_AGENT))||{};}catch(e){a={};}
  if(USE_MOCK&&(!a.name))a=MOCK.agent;
  const districts=a.districts||a.regions||[];
  $('#view-profile').innerHTML=`
    <div class="profile-head">
      <div class="avatar">${esc(initials(a.name||'A'))}</div>
      <div class="name">${esc(a.name||'Агент')}</div>
      <div class="phone">${esc(a.phone||'')}</div>
    </div>
    <div class="section-label">Мои районы</div>
    <div style="margin-bottom:24px">
      ${districts.length?districts.map(d=>`<div class="district"><span class="dot"></span>${esc(d)}</div>`).join(''):'<div class="empty" style="padding:24px">Районы не назначены</div>'}
    </div>
    <button class="btn btn-danger" id="logoutBtn">Выйти</button>
  `;
  $('#logoutBtn').addEventListener('click',doLogout);
}

/* ===================== BOOT ===================== */
(function boot(){
  if(token()){
    if(token()==='mock-token')USE_MOCK=true;
    enterApp();
  }else{
    $('#loginScreen').style.display='flex';
  }
})();
</script>
</body>
</html>
