<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenti — Панель агента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0E37A3;--light:#2E7BD6;--bg:#f0f4fb;--sidebar-bg:#0b0f1a;
  --card:#ffffff;--text:#16233F;--muted:#7C8BA5;
  --success:#1ec27f;--warning:#C98A2E;--danger:#D5564B;
  --border:#e3eaf4;
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(16,35,63,.06),0 1px 2px rgba(16,35,63,.04);
  --shadow-md:0 8px 24px rgba(16,35,63,.08);
  --shadow-lg:0 20px 50px rgba(16,35,63,.16);
  --sidebar-w:240px;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --t:.18s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--light);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c7d2e3;border-radius:8px;border:2px solid var(--bg)}

/* LOGIN */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef2f8;z-index:1000}
.login-card{width:420px;background:#fff;border-radius:18px;padding:44px 40px 40px;box-shadow:0 4px 40px rgba(14,55,163,.10);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.login-brand-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#0e37a3,#2e7bd6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:900;margin-bottom:14px;box-shadow:0 8px 24px rgba(14,55,163,.28)}
.login-brand-title{font-size:22px;font-weight:800;color:#0f1b35;margin-bottom:3px}
.login-brand-sub{font-size:13px;color:#8897b0;font-weight:500}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:#3a4a6b}
.input{width:100%;height:46px;border:1.5px solid #e1e8f2;border-radius:var(--radius-sm);padding:0 14px;background:#fafcff;transition:border var(--t),box-shadow var(--t)}
.input:focus{outline:none;border-color:var(--light);box-shadow:0 0 0 3px rgba(46,123,214,.14);background:#fff}
.btn{height:46px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform var(--t),box-shadow var(--t),background var(--t),opacity var(--t)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(14,55,163,.28)}
.btn-primary:hover{background:#0c2f8c}
.btn-block{width:100%}
.btn-ghost{background:#eef3fb;color:var(--text)}
.btn-ghost:hover{background:#e3ebf7}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.login-error{color:var(--danger);font-size:13px;margin-top:4px;min-height:18px;font-weight:600}

/* APP SHELL */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#cdd6e6;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.sidebar .brand .mark{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--light));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
.sidebar .brand .name{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.4px}
.sidebar-role{font-size:11px;font-weight:700;color:#4a5a7a;text-transform:uppercase;letter-spacing:.8px;padding:0 20px 12px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#9aa7be;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background var(--t),color var(--t);cursor:pointer}
.nav-item .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .ic svg{width:18px;height:18px}
.nav-item:hover{background:#161c2b;color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;box-shadow:0 6px 16px rgba(14,55,163,.35)}
.sidebar .foot{padding:14px 12px;border-top:1px solid #1a2233}
.agent-foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px}
.agent-foot .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.agent-foot .info{flex:1;min-width:0}
.agent-foot .info .nm{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-foot .info .rl{font-size:11px;color:#6a7a9a}
.btn-logout{color:#6a7a9a;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:none;transition:var(--t)}
.btn-logout:hover{background:#161c2b;color:#fff}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:64px;background:rgba(240,244,251,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;display:flex;align-items:center;padding:0 28px;gap:16px;border-bottom:1px solid #e3eaf4}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.4px;flex:1}
.content{padding:24px 28px 48px;flex:1}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform var(--t),box-shadow var(--t);cursor:pointer}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.stat .ico svg{width:22px;height:22px}
.stat .label{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.stat .value{font-size:28px;font-weight:800;letter-spacing:-.6px}
.stat .value .cur{font-size:15px;font-weight:700;color:var(--muted);margin-left:4px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}

/* TABLE */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:14px 18px;background:#f7faff;border-bottom:1px solid #eaf0f8;white-space:nowrap}
tbody td{padding:14px 18px;border-bottom:1px solid #f0f4fb;font-size:13.5px;vertical-align:middle}
tbody tr{transition:background var(--t)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f6f9ff}
tbody tr:last-child td{border-bottom:none}
.cell-user{display:flex;align-items:center;gap:11px}
.cell-user .avatar{width:34px;height:34px;font-size:13px}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.seg-tabs{display:flex;background:#eef3fb;border-radius:12px;padding:4px;gap:2px}
.seg-tab{padding:8px 20px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:var(--t);white-space:nowrap}
.seg-tab:hover{color:var(--text)}
.seg-tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.10)}
.seg-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:#e05252;color:#fff;font-size:11px;font-weight:700;margin-left:5px;padding:0 4px;line-height:1}
.search{position:relative;flex:1;max-width:360px;min-width:200px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .input{padding-left:40px;height:42px;background:#fff}

/* AVATAR */
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* PILL / BADGE */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-pending{background:#fdf3e3;color:var(--warning)}
.pill-approved{background:#e3f8ef;color:var(--success)}
.pill-rejected{background:#fbe9e7;color:var(--danger)}
.pill-shipping{background:#e8f4fd;color:#1a6fb5}
.pill-confirmed{background:#f0e8fd;color:#7c3aed}
.pill-delivered{background:#e3f8ef;color:var(--success)}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,#eef3fb 25%,#e2ecf8 50%,#eef3fb 75%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:10px;height:20px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0% 50%}}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* CARD */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card-pad{padding:22px}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.section-head h2{font-size:17px;font-weight:800;letter-spacing:-.3px;flex:1}

/* TOASTS */
#toasts{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);padding:13px 16px;display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;border-left:4px solid var(--success);animation:slideIn .3s cubic-bezier(.34,1.56,.64,1)}
.toast.out{animation:slideOut .3s forwards}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast b{display:block;font-weight:700;font-size:13.5px}
.toast small{color:var(--muted);font-size:12px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(11,15,26,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;z-index:200;opacity:0;animation:fade .2s forwards;overflow-y:auto}
.modal{background:var(--card);border-radius:var(--radius-lg);width:560px;max-width:100%;box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.modal.wide{width:760px}
.modal-head{display:flex;align-items:center;gap:14px;padding:22px 24px 16px;border-bottom:1px solid #eef3fb}
.modal-head h3{font-size:19px;font-weight:800;letter-spacing:-.4px}
.modal-head .x{margin-left:auto;width:34px;height:34px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:var(--t)}
.modal-head .x:hover{background:#f0f4fb;color:var(--text)}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid #eef3fb;display:flex;gap:10px;justify-content:flex-end}
.sub-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 10px}
.balance-box{background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;border-radius:var(--radius);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}
.balance-box .lab{font-size:12.5px;opacity:.85;font-weight:600}
.balance-box .num{font-size:24px;font-weight:800}

/* STEPPER */
.stepper{display:flex;align-items:center;gap:0;margin:14px 0 8px;overflow-x:auto}
.step-item{display:flex;align-items:center;flex:1;min-width:0}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step-circle.done{background:var(--success);color:#fff}
.step-circle.active{background:var(--primary);color:#fff}
.step-circle.idle{background:#e8edf5;color:var(--muted)}
.step-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.step-label{font-size:9.5px;text-align:center;line-height:1.2;max-width:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-line{flex:1;height:2px;margin:0 2px;margin-bottom:16px}

/* TX CREATE MODAL search */
.user-search-wrap{position:relative}
.user-results{position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:10;max-height:220px;overflow-y:auto;display:none;border:1px solid var(--border)}
.user-results.open{display:block}
.user-result-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f0f4fb;transition:background .12s}
.user-result-item:last-child{border-bottom:none}
.user-result-item:hover{background:#eef3fb}
.uri-av{width:32px;height:32px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.uri-name{font-weight:700;font-size:13px}
.uri-ph{font-size:11.5px;color:var(--muted)}
.selected-user{display:none;align-items:center;gap:10px;background:#eef3fb;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px}
.selected-user.show{display:flex}
.cashback-hint{background:#e3f8ef;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;font-weight:600;color:var(--success);margin-bottom:14px;display:none}
.cashback-hint.show{display:block}

/* GIFT CARDS */
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gift-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.gift-card img{width:100%;height:140px;object-fit:cover;display:block;background:#eef3fb}
.gift-card-body{padding:14px}
.gift-card-name{font-weight:700;font-size:14px;margin-bottom:6px}
.gift-card-price{color:var(--primary);font-weight:800;font-size:15px}
.gift-card-stock{font-size:12px;color:var(--muted);margin-top:4px}

/* ANIMATIONS */
@keyframes fade{to{opacity:1}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateX(30px);opacity:0}}

/* DASH RECENT */
/* PAGER */
.pager{display:flex;align-items:center;padding:14px 18px;gap:12px;border-top:1px solid #f0f4fb}
.pager .info{font-size:13px;color:var(--muted);flex:1}
.pager .pages{display:flex;gap:4px}
.pg-btn{height:32px;min-width:32px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:600;background:#eef3fb;color:var(--text);transition:var(--t)}
.pg-btn:hover{background:#dde8f7}
.pg-btn.active{background:var(--primary);color:#fff}

.dash-grid{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.txn-list{display:flex;flex-direction:column;gap:8px}
.txn-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#f7faff;border-radius:11px}
.txn-item .amt{margin-left:auto;text-align:right}
.txn-item .amt b{display:block;font-weight:800}
.txn-item .amt small{color:var(--muted);font-size:11.5px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">S</div>
      <div class="login-brand-title">scenti</div>
      <div class="login-brand-sub">Панель агента</div>
    </div>
    <form id="loginForm">
      <div class="field">
        <label>Имя пользователя</label>
        <input class="input" id="loginUser" type="text" placeholder="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input class="input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Войти</button>
      <div class="login-error" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="mark">S</div>
      <span class="name">scenti</span>
    </div>
    <div class="sidebar-role">Панель агента</div>
    <nav class="nav">
      <div class="nav-item active" data-page="dash">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
        <span class="label">Dashboard</span>
      </div>
      <div class="nav-item" data-page="clients">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span class="label">Клиенты</span>
      </div>
      <div class="nav-item" data-page="txns">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg></span>
        <span class="label">Транзакции</span>
      </div>
      <div class="nav-item" data-page="gifts">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20,12 20,22 4,22 4,12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></span>
        <span class="label">Подарки</span>
      </div>
      <div class="nav-item" data-page="grequests">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        <span class="label">Заявки на подарки</span>
      </div>
    </nav>
    <div class="foot">
      <div class="agent-foot">
        <div class="av" id="sideAv">А</div>
        <div class="info">
          <div class="nm" id="sideAgentName">Агент</div>
          <div class="rl">Агент</div>
        </div>
      </div>
      <button class="btn-logout btn-block" onclick="doLogout()" style="width:100%;margin-top:6px;text-align:left;padding:8px 12px">Выйти</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<script>
const API_BASE = '';
const LS_TOKEN = 'scenti_agent_token';
const LS_AGENT = 'scenti_agent_profile';

/* ===== UTILS ===== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU'); }
function fmtDate(d){
  if(!d)return '—';
  const dt=new Date(d);
  return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function initials(s){ if(!s)return '?'; const p=s.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function paginate(arr,page,perPage=20){ const t=Math.ceil(arr.length/perPage)||1; const items=arr.slice((page-1)*perPage,page*perPage); return{items,page,total:t,count:arr.length}; }
function loadingRows(cols,n=5){ return Array(n).fill(`<tr>${Array(cols).fill('<td><div class="skeleton" style="height:16px"></div></td>').join('')}</tr>`).join(''); }

let _toastId=0;
function toast(msg,type='',dur=3400){
  const el=document.createElement('div');
  el.className='toast'+(type==='err'?' err':type==='warn'?' warn':'');
  el.innerHTML=`<b>${esc(msg)}</b>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},dur);
}

/* ===== AUTH ===== */
const token = ()=>localStorage.getItem(LS_TOKEN);

async function api(path,{method='GET',body=null}={}){
  const headers={'Content-Type':'application/json'};
  if(token()) headers['Authorization']='Bearer '+token();
  const res=await fetch(API_BASE+path,{method,headers,body:body?JSON.stringify(body):null});
  if(res.status===401){doLogout();throw new Error('401');}
  if(!res.ok){let m='Ошибка сервера';try{const j=await res.json();m=j.detail||j.message||m;}catch(e){}throw new Error(m);}
  if(res.status===204)return null;
  return res.json();
}

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('#loginBtn'),err=$('#loginErr');
  err.textContent='';
  const username=$('#loginUser').value.trim();
  const password=$('#loginPass').value;
  btn.disabled=true;btn.textContent='Вход...';
  try{
    const data=await api('/auth/agent/login',{method:'POST',body:{username,password}});
    localStorage.setItem(LS_TOKEN,data.token||data.access_token);
    // Load agent profile
    try{
      const me=await api('/agent/me');
      localStorage.setItem(LS_AGENT,JSON.stringify(me));
    }catch(e){}
    enterApp();
  }catch(ex){
    err.textContent=ex.message||'Неверный логин или пароль';
  }finally{
    btn.disabled=false;btn.textContent='Войти';
  }
});

function doLogout(){
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_AGENT);
  $('#app').style.display='none';
  $('#login').style.display='flex';
}

function enterApp(){
  $('#login').style.display='none';

    const name=a.name||'Агент';
    $('#sideAgentName').textContent=name;

}

let _txSearchTimer=null;
window.txSearchClient=function(q){
  const res=$('#txUserResults');if(!res)return;
  const query=q.trim().toLowerCase();
  if(!query){res.classList.remove('open');return;}
  clearTimeout(_txSearchTimer);
  // Поиск по локальному кешу
  const filtered=_allClients.filter(u=>{
    const n=((u.first_name||'')+(u.last_name||'')+' '+(u.business_name||'')+' '+(u.phone||'')).toLowerCase();
    return n.includes(query);
  }).slice(0,8);
  if(filtered.length){
    renderTxResults(filtered,res);
    return;
  }
  // Если локальный кеш пуст — ищем через API
  res.innerHTML='<div class="user-result-item" style="color:var(--muted)">Поиск...</div>';
  res.classList.add('open');
  _txSearchTimer=setTimeout(async()=>{
    try{
      const d=await api('/agent/users?all=true&search='+encodeURIComponent(query));
      const arr=Array.isArray(d)?d:(d.users||[]);
      if(arr.length) _allClients=[..._allClients,...arr.filter(u=>!_allClients.find(c=>c.id===u.id))];
      if(!arr.length){res.innerHTML='<div class="user-result-item" style="color:var(--muted)">Не найдено</div>';return;}
      renderTxResults(arr,res);
    }catch(e){res.innerHTML='<div class="user-result-item" style="color:var(--danger)">Ошибка поиска</div>';}
  },300);
};
function renderTxResults(arr,res){
  res.innerHTML=arr.map(u=>{
    const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.business_name||'—';
    return `<div class="user-result-item" onclick="txSelectUser(${u.id},'${esc(nm)}','${esc(u.phone||'')}')">
      <div class="uri-av">${initials(nm)}</div>
      <div><div class="uri-name">${esc(nm)}</div><div class="uri-ph">${esc(u.phone||'')}</div></div>
    </div>`;
  }).join('');
  res.classList.add('open');
};

window.txUpdateCashback=function(){
  const amt=Number(($('#txAmount')||{}).value||0);

  if(amt>0){hint.textContent=`Кешбэк клиенту: ${fmt(Math.round(amt*0.1))} сум (10%)`;hint.classList.add('show');}

window.submitNewTx=async function(){
  if(!_newTxUser){toast('Выберите клиента','err');return;}
  const amount=Number(($('#txAmount')||{}).value||0);
  if(amount<=0){toast('Введите сумму','err');return;}
  const note=($('#txNote')||{}).value||'';
  const btn=$('#txSubmitBtn');
  if(btn){btn.disabled=true;btn.textContent='Отправка...';}
  try{
    await api('/agent/transactions',{method:'POST',body:{user_id:_newTxUser.id,amount,note}});
    closeModal();
    toast('Транзакция отправлена на подтверждение','',4000);
    // refresh
    const data=await api('/agent/transactions').catch(()=>[]);
    _txns=Array.isArray(data)?data:[];
    renderTxns();
  }catch(ex){
    if(ex.message!=='401')toast(ex.message||'Ошибка','err');
    if(btn){btn.disabled=false;btn.textContent='Отправить на подтверждение';}
  }
};

/* ===== PAGE: GIFTS ===== */
async function pageGifts(){
  const c=$('#content');
  c.innerHTML=`<div id="giftsGrid" class="gift-grid">${Array(4).fill('<div class="gift-card"><div class="skeleton" style="height:140px"></div><div class="gift-card-body"><div class="skeleton" style="height:16px;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:60%"></div></div></div>').join('')}</div>`;
  try{
    const data=await api('/agent/gifts');
    const gifts=Array.isArray(data)?data:[];
    if(!gifts.length){$('#giftsGrid').innerHTML='<div class="empty" style="grid-column:1/-1">Подарков нет</div>';return;}
    $('#giftsGrid').innerHTML=gifts.map(g=>`<div class="gift-card">
      ${g.image_url
        ?`<img src="${esc(g.image_url)}" alt="${esc(g.name_ru)}" onerror="this.style.display='none'">`
        :`<div style="width:100%;height:140px;background:linear-gradient(135deg,#dbe6f7,#eef3fb);display:flex;align-items:center;justify-content:center;font-size:40px">🎁</div>`}
      <div class="gift-card-body">
        <div class="gift-card-name">${esc(g.name_ru)}</div>
        <div class="gift-card-price">${fmt(g.price_cashback)} сум кешбэка</div>
        ${g.stock!=null?`<div class="gift-card-stock">В наличии: ${g.stock} шт.</div>`:''}
      </div>
    </div>`).join('');
  }catch(e){if(e.message!=='401')toast(e.message,'err');}
}

/* ===== PAGE: GIFT REQUESTS ===== */
const GR_STAGES=[
  {key:'pending',label:'Заявка'},
  {key:'approved',label:'Одобрено'},
  {key:'shipping',label:'Доставка'},
  {key:'confirmed',label:'У клиента'},
  {key:'delivered',label:'Получено'},
];
const GR_STATUS={
  pending:{cls:'pill-pending',label:'В обработке'},
  approved:{cls:'pill-approved',label:'Одобрено'},
  shipping:{cls:'pill-shipping',label:'Доставка'},
  confirmed:{cls:'pill-confirmed',label:'Подтверждение'},
  delivered:{cls:'pill-delivered',label:'Доставлено'},
  rejected:{cls:'pill-rejected',label:'Отклонено'},
};

const GR_TABS=[
  {key:'pending',   label:'В обработке'},
  {key:'approved',  label:'Одобрено'},
  {key:'shipping',  label:'У доставки'},
  {key:'confirmed', label:'Ожидает клиента'},
  {key:'delivered', label:'Завершённые'},
  {key:'rejected',  label:'Отклонённые'},
];

let _grequests=[];let _grFilter='pending';
async function pageGRequests(){
  const c=$('#content');
  c.innerHTML=`
    <div class="toolbar" style="margin-bottom:14px">
      <div class="seg-tabs" id="grTabs" style="gap:2px">${GR_TABS.map(t=>`<button class="seg-tab${t.key===_grFilter?' active':''}" data-f="${t.key}" onclick="setGrFilter('${t.key}')">${t.label}<span class="seg-cnt" id="grCnt_${t.key}" style="display:none"></span></button>`).join('')}</div>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>Клиент</th><th>Подарок</th><th>Цена</th><th>Статус</th><th>Дата</th></tr></thead>
      <tbody id="grBody">${loadingRows(5)}</tbody></table>
    </div>`;
  try{
    const data=await api('/agent/gift-requests');
    _grequests=Array.isArray(data)?data:[];
    updateGrCounts();
    renderGRequests();
  }catch(e){if(e.message!=='401')toast(e.message,'err');}
}

function updateGrCounts(){
  GR_TABS.forEach(t=>{
    const n=_grequests.filter(r=>r.status===t.key).length;
    const el=$(`#grCnt_${t.key}`);if(!el)return;
    if(n>0){el.textContent=n;el.style.display='inline-flex';}
    else el.style.display='none';
  });
}

function setGrFilter(f){
  _grFilter=f;
  document.querySelectorAll('#grTabs .seg-tab').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
  renderGRequests();
}

function renderGRequests(){
  const body=$('#grBody');if(!body)return;
  const list=_grequests.filter(r=>r.status===_grFilter);
  if(!list.length){body.innerHTML=`<tr><td colspan="5"><div class="empty">Нет заявок</div></td></tr>`;return;}
  body.innerHTML=list.map((r,i)=>{
    const ridx=_grequests.indexOf(r);
    const st=GR_STATUS[r.status]||{cls:'pill-pending',label:r.status};
    const name=[r.first_name,r.last_name].filter(Boolean).join(' ')||r.user_name||'—';
    return `<tr class="clickable" onclick="openGRModal(${ridx})">
      <td><div class="cell-user"><div class="avatar" style="width:32px;height:32px;font-size:12px">${initials(name)}</div><b>${esc(name)}</b></div></td>
      <td>${esc(r.gift_name||r.name_ru||'—')}</td>
      <td><b style="color:var(--primary)">${fmt(r.price||r.price_cashback||0)} сум</b></td>
      <td><span class="pill ${st.cls}">${st.label}</span></td>
      <td style="color:var(--muted)">${fmtDate(r.created_at)}</td>
    </tr>`;
  }).join('');
}

const GR_TRANSITIONS={
  pending:['approved','rejected'],
  approved:['shipping','rejected'],
  shipping:['rejected'],
  confirmed:['delivered'],
  delivered:[],
  rejected:[],
};
const GR_BTN_LABELS={
  approved:'Одобрить',
  shipping:'Передать в доставку',
  confirmed:'Подтвердить у клиента',
  delivered:'Отмечено доставленным',
  rejected:'Отклонить',
};

window.openGRModal=function(idx){
  const r=_grequests[idx];if(!r)return;
  const name=[r.first_name,r.last_name].filter(Boolean).join(' ')||r.user_name||'—';
  const st=GR_STATUS[r.status]||{cls:'pill-pending',label:r.status};
  const flow=['pending','approved','shipping','confirmed','delivered'];
  const cur=flow.indexOf(r.status);
  const stepper=r.status==='rejected'?`<div style="color:var(--danger);font-weight:700;padding:12px 0">❌ Заявка отклонена</div>`
    :`<div class="stepper">${flow.map((s,i)=>{
      const done=i<cur,active=i===cur;
      const stage=GR_STAGES.find(x=>x.key===s)||{label:s};
      return `<div class="step-item">
        <div class="step-col">
          <div class="step-circle ${done?'done':active?'active':'idle'}">${done?'✓':i+1}</div>
          <div class="step-label" style="color:${active?'var(--primary)':done?'var(--success)':'var(--muted)'};font-weight:${active?700:500}">${stage.label}</div>
        </div>
        ${i<flow.length-1?`<div class="step-line" style="background:${i<cur?'var(--success)':'#e8edf5'}"></div>`:''}
      </div>`;
    }).join('')}</div>`;

  const allowed=GR_TRANSITIONS[r.status]||[];
  const actionBtns=allowed.filter(s=>s!=='rejected').map(s=>
    `<button class="btn btn-primary" onclick="agentSetGrStatus(${r.id},'${s}')">${GR_BTN_LABELS[s]||s}</button>`
  ).join('');
  const rejectBtn=allowed.includes('rejected')
    ?`<button class="btn" style="background:#fee2e2;color:var(--danger);border:1px solid #fca5a5" onclick="agentSetGrStatus(${r.id},'rejected')">Отклонить</button>`:'';

  openModal(`<div class="modal wide">
    <div class="modal-head"><h3>Заявка на подарок</h3><button class="x">✕</button></div>
    <div class="modal-body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="avatar" style="width:44px;height:44px;font-size:16px">${initials(name)}</div>
          <div><b style="font-size:16px">${esc(name)}</b><div style="color:var(--muted);font-size:13px">${fmtDate(r.created_at)}</div></div>
        </div>
        <span class="pill ${st.cls}">${st.label}</span>
      </div>
      <div style="background:#f7faff;border-radius:var(--radius-sm);padding:14px;margin-bottom:16px">
        <div style="font-weight:700;font-size:15px">${esc(r.gift_name||r.name_ru||'—')}</div>
        <div style="color:var(--primary);font-weight:800;margin-top:4px">${fmt(r.price||r.price_cashback||0)} сум кешбэка</div>
      </div>
      <div class="sub-label" style="margin-top:0">Прогресс</div>
      ${stepper}
      ${r.admin_notes?`<div style="background:#fdf3e3;border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;font-size:13px"><b>Комментарий:</b> ${esc(r.admin_notes)}</div>`:''}
    </div>
    <div class="modal-foot" style="gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost x" style="margin-right:auto">Закрыть</button>
      ${rejectBtn}
      ${actionBtns}
    </div>
  </div>`);
};

window.agentSetGrStatus=async function(grId,status){
  const labels={approved:'одобрить заявку',shipping:'передать в доставку',delivered:'отметить как доставленный',rejected:'отклонить заявку'};
  const label=labels[status]||'изменить статус';
  closeModal();
  await new Promise(resolve=>{
    const foot=`<button class="btn btn-ghost" id="_cfNo">Отмена</button><button class="btn btn-primary" id="_cfYes">Да, подтвердить</button>`;
    const body=`<p style="color:var(--muted)">Вы уверены, что хотите <b>${label}</b>?</p>`;
    openModal(`<div class="modal"><div class="modal-head"><h3>Подтверждение</h3><button class="x">✕</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`);
    $('#_cfYes').onclick=()=>{closeModal();resolve(true);};
    $('#_cfNo').onclick=()=>{closeModal();resolve(false);};
  }).then(async ok=>{
    if(!ok)return;
    try{
      await api(`/agent/gift-requests/${grId}/status`,{method:'PATCH',body:{status}});
      toast('Статус обновлён');
      pageGRequests();
    }catch(e){
      toast(e.message||'Ошибка','err');
    }
  });
};

/* ===== BOOT ===== */
if(token()){
  enterApp();
}else{
  $('#login').style.display='flex';
}
</script>
</body>
