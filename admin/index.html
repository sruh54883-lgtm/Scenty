  renderNav();
  // Show spinner in content while regions load
  $("#content").innerHTML=`<div class="page-loading"><div class="spin"></div><span>Загрузка данных...</span></div>`;
  npStart();
  await loadRegions();
  rebuildRegionsCompat();
  npDone();
  hideBoot();
  const _rawPath = window.location.pathname.replace(/\/$/, '') || '/admin';
  const initPage = URL_TO_PAGE[window.location.pathname] || URL_TO_PAGE[_rawPath] || 'dash';
  go(initPage, false);
}

/* auto-collapse on small screens */
function autoCollapse(){ if(window.innerWidth<1100)document.body.classList.add("collapsed"); }
window.addEventListener("resize",()=>{ if(window.innerWidth<1100)document.body.classList.add("collapsed"); });

/* boot */
// Не входить автоматически с demo-token из localStorage — показать логин
if(State.token && State.token!=="demo-token"){ enterApp(); } else { State.token=null; localStorage.removeItem("scenti_admin_token"); hideBoot(); $("#loginUser").focus(); }
autoCollapse();

/* ===================== DRAWER ===================== */
(function(){
  const overlay = document.createElement("div");
  overlay.className = "drawer-overlay";
  overlay.id = "drawerOverlay";
  const drawer = document.createElement("div");
  drawer.className = "drawer";
  drawer.id = "drawer";
  drawer.innerHTML = `
    <div class="drawer-head">
      <h3 id="drawerTitle">—</h3>
      <div class="drawer-close" onclick="closeDrawer()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>`;
  document.body.appendChild(overlay);
  document.body.appendChild(drawer);
  overlay.addEventListener("click", ()=>closeDrawer());
})();

window.openDrawer = async function(type){
  const overlay=document.getElementById("drawerOverlay");
  const drawer=document.getElementById("drawer");
  const body=document.getElementById("drawerBody");
  const title=document.getElementById("drawerTitle");
  overlay.classList.add("open");
  drawer.classList.add("open");
  body.innerHTML=`<div class="drawer-empty">Загрузка...</div>`;
  title.textContent="Загрузка...";
  try{
    const {df,dt}=_dashDates();
    const periodQs=df&&dt?`&date_from=${df}&date_to=${dt}`:'';
    const data = await api(`/admin/dashboard/detail?type=${type}${periodQs}`);
    title.textContent = data.title || "Детали";
    if(data.type !== "all_activity" && (!data.rows || !data.rows.length)){
      body.innerHTML=`<div class="drawer-empty">Нет данных</div>`;
      return;
    }
    if(data.type==="users"){
      const eyeSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
      body.innerHTML=`<table>
        <thead><tr><th>#</th><th>Имя</th><th>Телефон</th><th>Баланс</th><th>Дата</th><th></th></tr></thead>
        <tbody>${data.rows.map((u,i)=>`<tr>
          <td class="muted">${i+1}</td>
          <td><b>${esc(u.name||"—")}</b></td>
          <td class="muted" style="font-size:12px">${esc(u.phone||u.telegram_id||"—")}</td>
          <td style="font-weight:700;color:var(--primary)">${fmt(u.cashback_balance||0)} <span class="muted" style="font-size:11px">сум</span></td>
          <td class="muted" style="font-size:12px">${fmtDate(u.created_at)}</td>
          <td><button style="padding:5px 8px;border-radius:8px;border:none;background:#eaf2ff;color:var(--primary);cursor:pointer;display:flex;align-items:center" onclick="closeDrawer&&closeDrawer();openUser(${u.id})" title="Открыть клиента">${eyeSvg}</button></td>
        </tr>`).join("")}</tbody>
      </table>`;
    } else if(data.type==="txns"){
      const pillMap={pending:["#fdf3e3","#c47a00","Ожидание"],approved:["#e3f8ef","#16a34a","Одобрено"],rejected:["#fde8e8","#dc2626","Отклонено"]};
      body.innerHTML=`<table>
        <thead><tr><th>#</th><th>Клиент</th><th>Агент</th><th>Сумма</th><th>Кешбэк</th><th>Статус</th><th>Дата</th></tr></thead>
        <tbody>${data.rows.map((t,i)=>{
          const [bg,cl,lb]=pillMap[t.status]||["#f0f0f0","#666",t.status];
          return `<tr>
            <td class="muted">${i+1}</td>
            <td><b>${esc(t.user_name||"—")}</b></td>
            <td class="muted" style="font-size:12px">${esc(t.agent_name||"—")}</td>
            <td style="font-weight:700">${fmt(t.amount||0)}</td>
            <td style="font-weight:700;color:var(--success)">+${fmt(t.cashback_amount||0)}</td>
            <td><span class="drawer-badge" style="background:${bg};color:${cl}">${lb}</span></td>
            <td class="muted" style="font-size:12px">${fmtDate(t.created_at)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;
    } else if(data.type==="claims"){
      const pillMap={pending:["#fdf3e3","#c47a00","Ожидание"],approved:["#e3f8ef","#16a34a","Одобрено"],rejected:["#fde8e8","#dc2626","Отклонено"],shipping:["#eaf2ff","#2563eb","Доставка"],delivered:["#e3f8ef","#16a34a","Доставлено"]};
      body.innerHTML=`<table>
        <thead><tr><th>#</th><th>Клиент</th><th>Подарок</th><th>Цена</th><th>Статус</th><th>Дата</th></tr></thead>
        <tbody>${data.rows.map((r,i)=>{
          const [bg,cl,lb]=pillMap[r.status]||["#f0f0f0","#666",r.status];
          return `<tr>
            <td class="muted">${i+1}</td>
            <td><b>${esc(r.user_name||"—")}</b></td>
            <td>${esc(r.gift_name||"—")}</td>
            <td style="font-weight:700;color:var(--primary)">${fmt(r.price||0)} <span class="muted" style="font-size:11px">сум</span></td>
            <td><span class="drawer-badge" style="background:${bg};color:${cl}">${lb}</span></td>
            <td class="muted" style="font-size:12px">${fmtDate(r.created_at)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;
    } else if(data.type==="gifts"){
      body.innerHTML=`<table>
        <thead><tr><th>#</th><th>Название</th><th>Цена (кешбэк)</th><th>Остаток</th><th>Добавлен</th></tr></thead>
        <tbody>${data.rows.map((g,i)=>`<tr>
          <td class="muted">${i+1}</td>
          <td><b>${esc(g.name_ru||"—")}</b><br><small class="muted">${esc(g.name_uz||"")}</small></td>
          <td style="font-weight:700;color:var(--primary)">${fmt(g.price_cashback||0)} <span class="muted" style="font-size:11px">сум</span></td>
          <td style="font-weight:700">${g.stock!=null?g.stock:"∞"}</td>
          <td class="muted" style="font-size:12px">${fmtDate(g.created_at)}</td>
        </tr>`).join("")}</tbody>
      </table>`;
    } else if(data.type==="cashback_spends"){
      body.innerHTML=`<table>
        <thead><tr><th>#</th><th>Клиент</th><th>Списано</th><th>Тип</th><th>Дата</th></tr></thead>
        <tbody>${data.rows.map((s,i)=>{
          const isGift=s.gift_request_id!=null;
          return `<tr>
            <td class="muted">${i+1}</td>
            <td><b>${esc(s.user_name||"—")}</b></td>
            <td style="font-weight:700;color:#dc2626">-${fmt(s.amount||0)} сум</td>
            <td><span class="drawer-badge" style="background:${isGift?'#f3eaff':'#eaf2ff'};color:${isGift?'#7b46c9':'#2563eb'}">${isGift?'Подарок':'Оплата'}</span></td>
            <td class="muted" style="font-size:12px">${fmtDate(s.created_at)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;
    } else if(data.type==="all_activity"){
      const txnPillMap={pending:["#fdf3e3","#c47a00","Ожидание"],approved:["#e3f8ef","#16a34a","Одобрено"],rejected:["#fde8e8","#dc2626","Отклонено"],refund:["#FFF0D4","#C47A00","Возврат"]};
      const claimPillMap={pending:["#fdf3e3","#c47a00","Ожидание"],approved:["#e3f8ef","#16a34a","Одобрено"],rejected:["#fde8e8","#dc2626","Отклонено"],shipping:["#eaf2ff","#2563eb","Доставка"],delivered:["#e3f8ef","#16a34a","Доставлено"],confirmed:["#e3f8ef","#16a34a","Подтверждено"]};
      const tabs=[
        {id:"act-txns",  label:`Покупки (${data.txns.length})`},
        {id:"act-claims",label:`Подарки (${data.claims.length})`},
        {id:"act-spends",label:`Оплаты кешбэком (${data.spends.length})`},
      ];
      body.innerHTML=`
        <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap" id="actTabs">
          ${tabs.map((t,i)=>`<button onclick="actTab('${t.id}')" id="btn-${t.id}" style="padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid var(--border);cursor:pointer;background:${i===0?'var(--primary)':'#f5f7fa'};color:${i===0?'#fff':'var(--text)'}">${t.label}</button>`).join("")}
        </div>
        <div id="act-txns">
          ${data.txns.length?`<table><thead><tr><th>#</th><th>Клиент</th><th>Сумма</th><th>Кешбэк</th><th>Статус</th><th>Дата</th></tr></thead><tbody>
          ${data.txns.map((t,i)=>{const[bg,cl,lb]=txnPillMap[t.status]||["#f0f0f0","#666",t.status];return`<tr><td class="muted">${i+1}</td><td><b>${esc(t.user_name||"—")}</b><br><small class="muted">${esc(t.agent_name||"")}</small></td><td style="font-weight:700">${fmt(t.amount||0)}</td><td style="color:var(--success);font-weight:700">+${fmt(t.cashback_amount||0)}</td><td><span class="drawer-badge" style="background:${bg};color:${cl}">${lb}</span></td><td class="muted" style="font-size:12px">${fmtDate(t.created_at)}</td></tr>`;}).join("")}
          </tbody></table>`:`<div class="drawer-empty">Нет покупок</div>`}
        </div>
        <div id="act-claims" style="display:none">
          ${data.claims.length?`<table><thead><tr><th>#</th><th>Клиент</th><th>Подарок</th><th>Цена</th><th>Статус</th><th>Дата</th></tr></thead><tbody>
          ${data.claims.map((r,i)=>{const[bg,cl,lb]=claimPillMap[r.status]||["#f0f0f0","#666",r.status];return`<tr><td class="muted">${i+1}</td><td><b>${esc(r.user_name||"—")}</b></td><td>${esc(r.gift_name||"—")}</td><td style="font-weight:700;color:var(--primary)">${fmt(r.price||0)} сум</td><td><span class="drawer-badge" style="background:${bg};color:${cl}">${lb}</span></td><td class="muted" style="font-size:12px">${fmtDate(r.created_at)}</td></tr>`;}).join("")}
          </tbody></table>`:`<div class="drawer-empty">Нет заявок на подарки</div>`}
        </div>
        <div id="act-spends" style="display:none">
          ${data.spends.length?`<table><thead><tr><th>#</th><th>Клиент</th><th>Списано</th><th>Дата</th></tr></thead><tbody>
          ${data.spends.map((s,i)=>`<tr><td class="muted">${i+1}</td><td><b>${esc(s.user_name||"—")}</b></td><td style="font-weight:700;color:#dc2626">-${fmt(s.amount||0)} сум</td><td class="muted" style="font-size:12px">${fmtDate(s.created_at)}</td></tr>`).join("")}
          </tbody></table>`:`<div class="drawer-empty">Нет оплат кешбэком</div>`}
        </div>`;
    }
  }catch(e){
    body.innerHTML=`<div class="drawer-empty">Ошибка загрузки</div>`;
  }
};
window.closeDrawer = function(){
  document.getElementById("drawerOverlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
};
window.actTab = function(id){
  ["act-txns","act-claims","act-spends"].forEach(k=>{
    const el=document.getElementById(k); if(el) el.style.display=k===id?"":"none";
    const btn=document.getElementById("btn-"+k);
    if(btn){btn.style.background=k===id?"var(--primary)":"#f5f7fa";btn.style.color=k===id?"#fff":"var(--text)";}
  });
};
</script>
</body>
