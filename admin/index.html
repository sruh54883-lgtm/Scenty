<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenti — Супер-админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --primary:#0E37A3;
  --light:#2E7BD6;
  --bg:#f0f4fb;
  --sidebar-bg:#0b0f1a;
  --card:#ffffff;
  --text:#16233F;
  --muted:#7C8BA5;
  --success:#1ec27f;
  --warning:#C98A2E;
  --danger:#D5564B;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(16,35,63,.06),0 1px 2px rgba(16,35,63,.04);
  --shadow-md:0 8px 24px rgba(16,35,63,.08);
  --shadow-lg:0 20px 50px rgba(16,35,63,.16);
  --sidebar-w:240px;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --t:.18s cubic-bezier(.4,0,.2,1);
}

/* ===================== RESET ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--light);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c7d2e3;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#a9b8d0}

/* ===================== UTILITY ===================== */
.hidden{display:none !important}
.row{display:flex;align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.spacer{flex:1}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* ===================== LOGIN ===================== */
#login{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,#15306f 0%,#0b0f1a 60%);
  z-index:1000;
}
.login-card{
  width:380px;background:var(--card);border-radius:var(--radius-lg);
  padding:40px 36px;box-shadow:var(--shadow-lg);
  animation:pop .35s cubic-bezier(.34,1.56,.64,1);
}
.login-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.login-logo .mark{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;
}
.login-logo .name{font-size:26px;font-weight:800;letter-spacing:-.5px}
.login-sub{text-align:center;color:var(--muted);margin-bottom:28px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--text)}
.input{
  width:100%;height:46px;border:1.5px solid #e1e8f2;border-radius:var(--radius-sm);
  padding:0 14px;background:#fafcff;transition:border var(--t),box-shadow var(--t);
}
textarea.input{height:auto;padding:12px 14px;resize:vertical;min-height:90px;line-height:1.55}
.input:focus{outline:none;border-color:var(--light);box-shadow:0 0 0 3px rgba(46,123,214,.14);background:#fff}
.btn{
  height:46px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 20px;transition:transform var(--t),box-shadow var(--t),background var(--t),opacity var(--t);
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(14,55,163,.28)}
.btn-primary:hover{background:#0c2f8c}
.btn-block{width:100%}
.btn-ghost{background:#eef3fb;color:var(--text)}
.btn-ghost:hover{background:#e3ebf7}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{filter:brightness(.95)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.95)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px}
.login-error{color:var(--danger);font-size:13px;margin-top:4px;min-height:18px;font-weight:600}

/* ===================== APP SHELL ===================== */
#app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);color:#cdd6e6;
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  z-index:50;transition:width var(--t);
}
.sidebar .brand{
  display:flex;align-items:center;gap:10px;padding:22px 20px 18px;
}
.sidebar .brand .mark{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;
}
.sidebar .brand .name{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.4px;white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:#22293a;border:none}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:#9aa7be;font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:background var(--t),color var(--t);position:relative;
}
.nav-item .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .ic svg{width:18px;height:18px}
.nav-item:hover{background:#161c2b;color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;box-shadow:0 6px 16px rgba(14,55,163,.35)}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;
}
.nav-item.active .badge{background:#fff;color:var(--primary)}
.sidebar .foot{padding:12px;border-top:1px solid #1a2233}
.sidebar-collapse{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:#9aa7be;font-weight:600;font-size:13px;width:100%;
}
.sidebar-collapse:hover{background:#161c2b;color:#fff}

/* collapsed */
body.collapsed .sidebar{width:72px}
body.collapsed .sidebar .brand .name,
body.collapsed .nav-item span.label,
body.collapsed .sidebar-collapse span{display:none}
body.collapsed .nav-item{justify-content:center;padding:11px}
body.collapsed .nav-item .badge{position:absolute;top:4px;right:4px;margin:0}
body.collapsed .main{margin-left:72px}
body.collapsed .sidebar-collapse{justify-content:center}

.main{
  flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin var(--t);
  display:flex;flex-direction:column;min-height:100vh;
}
.topbar{
  height:64px;background:rgba(240,244,251,.85);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:30;display:flex;align-items:center;
  padding:0 28px;gap:16px;border-bottom:1px solid #e3eaf4;
}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.topbar .who{display:flex;align-items:center;gap:10px}
.avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--light));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.content{padding:24px 28px 48px;flex:1}

/* ===================== CARDS / STATS ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat{
  background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;transition:transform var(--t),box-shadow var(--t);
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat .ico{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
}
.stat .ico svg{width:22px;height:22px}
.stat .label{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.stat .value{font-size:28px;font-weight:800;letter-spacing:-.6px}
.stat .value .cur{font-size:15px;font-weight:700;color:var(--muted);margin-left:4px}
.stat .pill{position:absolute;top:18px;right:18px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card-pad{padding:22px}

/* ===================== TOOLBAR ===================== */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search{position:relative;flex:1;max-width:360px;min-width:200px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .input{padding-left:40px;height:42px;background:#fff}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.section-head h2{font-size:22px;font-weight:800;letter-spacing:-.5px}

/* ===================== TABS ===================== */
.tabs{display:inline-flex;background:#e6edf7;padding:4px;border-radius:12px;gap:2px;margin-bottom:18px}
.tab{
  padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);
  transition:all var(--t);display:flex;align-items:center;gap:7px;
}
.tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
.tab .cnt{background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:10px}
.tab.active .cnt{background:var(--primary)}

/* ===================== TABLE ===================== */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);padding:14px 18px;background:#f7faff;border-bottom:1px solid #eaf0f8;white-space:nowrap;
}
tbody td{padding:14px 18px;border-bottom:1px solid #f0f4fb;font-size:13.5px;vertical-align:middle}
tbody tr{transition:background var(--t)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f6f9ff}
tbody tr:last-child td{border-bottom:none}
tbody tr.removing{animation:rowOut .45s forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(40px);background:#eafaf2}}
.t-strong{font-weight:700}
.t-actions{display:flex;gap:8px;justify-content:flex-end}
.cell-user{display:flex;align-items:center;gap:11px}
.cell-user .avatar{width:34px;height:34px;font-size:13px}
.cell-user .meta b{display:block;font-weight:700;font-size:13.5px}
.cell-user .meta small{color:var(--muted);font-size:12px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#eef3fb;display:block}
.thumb-fallback{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#dbe6f7,#eef3fb);display:flex;align-items:center;justify-content:center;color:var(--light)}

.badge-status{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
  padding:5px 11px;border-radius:20px;white-space:nowrap;
}
.badge-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending{background:#fdf3e3;color:var(--warning)}
.st-confirmed,.st-approved,.st-active,.st-issued{background:#e3f8ef;color:var(--success)}
.st-rejected,.st-inactive{background:#fbe9e7;color:var(--danger)}
.st-neutral{background:#eef3fb;color:var(--muted)}

.tag{display:inline-block;background:#eef3fb;color:var(--light);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;color:var(--text);font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px}
.chip button{color:var(--muted);font-size:14px;line-height:1;display:flex}
.chip button:hover{color:var(--danger)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* pagination */
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid #f0f4fb}
.pager .info{color:var(--muted);font-size:13px}
.pager .pages{display:flex;gap:6px}
.pg-btn{
  min-width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid #e1e8f2;
  font-weight:700;font-size:13px;color:var(--text);transition:all var(--t);padding:0 8px;
}
.pg-btn:hover:not(:disabled){border-color:var(--light);color:var(--light)}
.pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

/* ===================== TOGGLE SWITCH ===================== */
.switch{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#cdd8ea;border-radius:20px;transition:var(--t)}
.switch .slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--success)}
.switch input:checked+.slider::before{transform:translateX(18px)}

/* ===================== MODAL ===================== */
.overlay{
  position:fixed;inset:0;background:rgba(11,15,26,.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;z-index:200;
  opacity:0;animation:fade .2s forwards;overflow-y:auto;
}
.modal{
  background:var(--card);border-radius:var(--radius-lg);width:560px;max-width:100%;
  box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;max-height:calc(100vh - 96px);
}
.modal.wide{width:760px}
.modal-head{display:flex;align-items:center;gap:14px;padding:22px 24px 16px;border-bottom:1px solid #eef3fb}
.modal-head h3{font-size:19px;font-weight:800;letter-spacing:-.4px}
.modal-head .x{margin-left:auto;width:34px;height:34px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:var(--t)}
.modal-head .x:hover{background:#f0f4fb;color:var(--text)}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid #eef3fb;display:flex;gap:10px;justify-content:flex-end}
.modal-foot.between{justify-content:space-between}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.check-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.check-row label{font-weight:600;cursor:pointer}
.sub-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 10px}

.kv-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.chips-edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* detail blocks */
.detail-hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.detail-hero .avatar{width:54px;height:54px;font-size:20px}
.detail-hero b{font-size:18px;font-weight:800;display:block}
.balance-box{
  background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;border-radius:var(--radius);
  padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px;
}
.balance-box .lab{font-size:12.5px;opacity:.85;font-weight:600}
.balance-box .num{font-size:24px;font-weight:800}
.txn-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.txn-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#f7faff;border-radius:11px}
.txn-item .amt{margin-left:auto;text-align:right}
.txn-item .amt b{display:block;font-weight:800}
.txn-item .amt small{color:var(--muted);font-size:11.5px}

/* multi-select districts */
.ms-box{border:1.5px solid #e1e8f2;border-radius:var(--radius-sm);padding:10px;max-height:200px;overflow-y:auto;background:#fafcff}
.ms-group{margin-bottom:8px}
.ms-group>strong{font-size:12px;color:var(--muted);display:block;margin:4px 0 6px;font-weight:800}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer}
.ms-opt:hover{background:#eef3fb}
.ms-opt input{width:16px;height:16px;accent-color:var(--primary)}

/* ===================== TOASTS ===================== */
#toasts{position:fixed;top:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:10px}
.toast{
  background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);padding:13px 16px;
  display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;
  border-left:4px solid var(--success);animation:slideIn .3s cubic-bezier(.34,1.56,.64,1);
}
.toast.out{animation:slideOut .3s forwards}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast .tic{width:22px;height:22px;flex-shrink:0}
.toast b{display:block;font-weight:700;font-size:13.5px}
.toast small{color:var(--muted);font-size:12px}

@keyframes slideIn{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(120%)}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}

/* settings page */
.setting-card{max-width:720px}
.info-banner{display:flex;gap:11px;align-items:center;background:#eaf2ff;color:var(--primary);padding:13px 16px;border-radius:12px;font-size:13px;font-weight:600;margin-top:16px}
.info-banner svg{width:20px;height:20px;flex-shrink:0}

.backup-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#f7faff;border-radius:12px;margin-bottom:9px}
.backup-item .fic{width:38px;height:38px;border-radius:10px;background:#eaf2ff;color:var(--primary);display:flex;align-items:center;justify-content:center}

.skeleton{background:linear-gradient(90deg,#eef3fb 25%,#f6f9ff 50%,#eef3fb 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
</head>
<body class="">

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="login-logo">
      <div class="mark">S</div>
      <div class="name">scenti</div>
    </div>
    <div class="login-sub">Супер-админ панель</div>
    <div class="field">
      <label>Логин</label>
      <input class="input" id="loginUser" autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input class="input" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Войти</button>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">S</div>
      <div class="name">scenti</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="sidebar-collapse" id="collapseBtn">
        <span class="ic" id="collapseIc"></span><span>Свернуть</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div class="who">
        <div class="avatar" id="topAvatar">A</div>
        <div>
          <b style="font-size:13px" id="topName">Администратор</b>
          <div class="muted" style="font-size:11.5px">Супер-админ</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="margin-left:8px">Выход</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   SCENTI SUPER-ADMIN  —  single-file SPA
   ============================================================ */
const API_BASE = "http://localhost:8000";

  if(!d) return "—";

  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("ru-RU",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtDateTime(d){
  const dt = new Date(d);
  if(isNaN(dt)) return d||"—";
  return dt.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})+" "+dt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}

/* ---------- TOASTS ---------- */
function toast(msg, type="ok", sub=""){
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast "+(type==="err"?"err":type==="warn"?"warn":"");
  const ic = type==="err"?I.x:type==="warn"?I.bell:I.check;
  const col = type==="err"?"var(--danger)":type==="warn"?"var(--warning)":"var(--success)";
  el.innerHTML = `<div class="tic" style="color:${col}">${ic}</div><div><b>${esc(msg)}</b>${sub?`<small>${esc(sub)}</small>`:""}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),300);},3200);
}

/* ---------- API ---------- */
async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(State.token) headers["Authorization"] = "Bearer "+State.token;
  const res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  if(res.status===401){ logout(); throw new Error("401"); }
  if(!res.ok){ throw new Error("HTTP "+res.status); }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : res.text();
}
// api with mock fallback
async function apiOrMock(path, mockFn, opts){
  try{ const r = await api(path, opts); State.useMock=false; return r; }
  catch(e){
    if(e.message==="401") throw e;
    State.useMock=true;
    return mockFn();
  }
}

/* ============================================================
   COMPONENTS: pagination, modal
   ============================================================ */
function paginate(arr, page, per=20){
  const total = arr.length, pages = Math.max(1, Math.ceil(total/per));
  const cur = Math.min(Math.max(1,page), pages);
  return {items:arr.slice((cur-1)*per, cur*per), cur, pages, total, per};
}
function pagerHTML(p, fn){
  if(p.pages<=1) return `<div class="pager"><div class="info">${p.total} записей</div></div>`;
  let btns="";
  for(let i=1;i<=p.pages;i++){
    btns+=`<button class="pg-btn ${i===p.cur?'active':''}" onclick="${fn}(${i})">${i}</button>`;
  }
  const from=(p.cur-1)*p.per+1, to=Math.min(p.cur*p.per,p.total);
  return `<div class="pager"><div class="info">${from}–${to} из ${p.total}</div><div class="pages">
    <button class="pg-btn" onclick="${fn}(${p.cur-1})" ${p.cur===1?'disabled':''}>‹</button>${btns}
    <button class="pg-btn" onclick="${fn}(${p.cur+1})" ${p.cur===p.pages?'disabled':''}>›</button></div></div>`;
}

let modalEsc=null;
function openModal(html, opts={}){
  const root = $("#modalRoot");
  const wide = opts.wide?" wide":"";
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal${wide}">${html}</div></div>`;
  const ov = $("#ov");
  ov.addEventListener("mousedown",e=>{ if(e.target===ov) closeModal(); });
  $$(".x",ov).forEach(x=>x.onclick=closeModal);
  modalEsc = e=>{ if(e.key==="Escape") closeModal(); };
  document.addEventListener("keydown",modalEsc);
  return ov;
}
function closeModal(){
  $("#modalRoot").innerHTML="";
  if(modalEsc){document.removeEventListener("keydown",modalEsc);modalEsc=null;}
}
function modalShell(title, body, foot){
  return `<div class="modal-head"><h3>${esc(title)}</h3><button class="x">${I.x}</button></div>
    <div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:""}`;
}

window.txnConfirm=async id=>{
  const row=$(`#txnBody tr[data-id="${id}"]`);
  try{ await api("/admin/transactions/"+id+"/confirm",{method:"POST"}); }catch(e){ if(e.message==="401")return; }
  const t=Txns.list.find(x=>x.id===id); if(t)t.status="confirmed";
  if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingTxn=Txns.list.filter(x=>x.status==="pending").length;renderNav();renderTxns();},450);}
  toast("Транзакция подтверждена","ok","Кешбэк начислен клиенту");
};
window.txnReject=id=>{
  const body=`<p style="margin-bottom:14px;color:var(--muted)">Укажите причину отклонения — клиент увидит её.</p>
    <textarea class="input" id="rejReason" placeholder="Например: фото чека нечитаемо"></textarea>`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-danger" id="rejDo">Отклонить транзакцию</button>`;
  openModal(modalShell("Отклонить транзакцию",body,foot));
  $("#rejDo").onclick=async()=>{
    const reason=$("#rejReason").value.trim();
    if(!reason){toast("Введите причину","err");return;}
    try{ await api("/admin/transactions/"+id+"/reject",{method:"POST",body:JSON.stringify({reason})}); }catch(e){ if(e.message==="401")return; }
    const t=Txns.list.find(x=>x.id===id); if(t){t.status="rejected";t.reason=reason;}
    closeModal();
    const row=$(`#txnBody tr[data-id="${id}"]`);
    if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingTxn=Txns.list.filter(x=>x.status==="pending").length;renderNav();renderTxns();},450);}
    toast("Транзакция отклонена","warn");
  };
};

const Claims={list:[],tab:"pending",page:1};

function renderClaims(){
  const counts={pending:0,approved:0,issued:0,rejected:0};
  Claims.list.forEach(x=>counts[x.status]!==undefined&&counts[x.status]++);
  $("#clTabs").innerHTML=`<div class="tabs">
    ${[["pending","Ожидают"],["approved","Одобрены"],["issued","Выданы"],["rejected","Отклонены"]].map(([k,l])=>
      `<div class="tab ${Claims.tab===k?'active':''}" onclick="clTab('${k}')">${l} ${counts[k]?`<span class="cnt">${counts[k]}</span>`:""}</div>`).join("")}
  </div>`;
  const arr=Claims.list.filter(x=>x.status===Claims.tab);
  const p=paginate(arr,Claims.page,20);
  const body=$("#clBody"); if(!body)return;
  if(!p.items.length){body.innerHTML=emptyRow(6,"Нет заявок");$("#clPager").innerHTML="";return;}
  body.innerHTML=p.items.map(x=>{
    let act="";
    if(x.status==="pending")act=`<button class="btn btn-success btn-sm" onclick="clSet(${x.id},'approved')">Одобрить</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="clReject(${x.id})">${I.x}</button>`;
    else if(x.status==="approved")act=`<button class="btn btn-primary btn-sm" onclick="clSet(${x.id},'issued')">Выдать</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="clReject(${x.id})">${I.x}</button>`;
    const st=x.status==="approved"?"approved":x.status==="issued"?"issued":x.status==="rejected"?"rejected":"pending";
    return `<tr data-id="${x.id}">
      <td><div class="cell-user"><div class="avatar">${initials(x.user_name)}</div><div class="meta"><b>${esc(x.user_name)}</b></div></div></td>
      <td>${esc(x.gift_name)}</td>
      <td class="t-strong mono">${fmtSum(x.price)}</td>
      <td class="muted nowrap">${fmtDate(x.created_at)}</td>
      <td><span class="badge-status st-${st}">${statusRu(x.status)}</span></td>
      <td class="t-actions">${act}</td></tr>`;
  }).join("");
  $("#clPager").innerHTML=pagerHTML(p,"clGo");
}
window.clTab=t=>{Claims.tab=t;Claims.page=1;renderClaims();};
window.clGo=p=>{Claims.page=p;renderClaims();};
window.clSet=async(id,status)=>{
  const x=Claims.list.find(c=>c.id===id);if(!x)return;
  try{ await api("/admin/claims/"+id,{method:"PUT",body:JSON.stringify({status})}); }catch(e){ if(e.message==="401")return; }

  const row=$(`#clBody tr[data-id="${id}"]`);
  if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingClaims=Claims.list.filter(c=>c.status==="pending").length;renderNav();renderClaims();},450);}

window.clReject=id=>{

  $("#clRejDo").onclick=async()=>{
    const reason=$("#clReason").value.trim(); if(!reason){toast("Введите причину","err");return;}
    const x=Claims.list.find(c=>c.id===id);
    try{ await api("/admin/claims/"+id,{method:"PUT",body:JSON.stringify({status:"rejected",reason})}); }catch(e){ if(e.message==="401")return; }
    if(x){x.status="rejected";x.reason=reason;}
    closeModal();
    const row=$(`#clBody tr[data-id="${id}"]`);
    if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingClaims=Claims.list.filter(c=>c.status==="pending").length;renderNav();renderClaims();},450);}
    toast("Заявка отклонена","warn");
  };
};

      tag_ru:$("#cTagRu").value,tag_uz:$("#cTagUz").value,image:$("#cImg").value,active:$("#cActive").checked,
      specs:collectSpecs(),features:catFeatures.slice()};

      if(id){await api("/admin/catalog/"+id,{method:"PUT",body:JSON.stringify(payload)});Object.assign(it,payload);}

function renderSpecs(){
  $("#cSpecs").innerHTML=catSpecs.map((s,i)=>`<div class="kv-row">

    <button class="btn btn-ghost btn-icon btn-sm" style="color:var(--danger)" onclick="catDelSpec(${i})">${I.x}</button></div>`).join("");
  $$("#cSpecs input").forEach(inp=>inp.oninput=function(){catSpecs[+this.dataset.si][+this.dataset.k]=this.value;});
}
function collectSpecs(){return catSpecs.filter(s=>s[0]||s[1]);}
window.catAddSpec=()=>{catSpecs.push(["",""]);renderSpecs();};
window.catDelSpec=i=>{catSpecs.splice(i,1);renderSpecs();};
function renderFeatures(){
  $("#cFeatures").innerHTML=catFeatures.map((f,i)=>`<span class="chip">${esc(f)}<button onclick="catDelFeature(${i})">${I.x}</button></span>`).join("")||'<span class="muted" style="font-size:12px">Нет особенностей</span>';
}
window.catAddFeature=()=>{const v=$("#cFeatInput").value.trim();if(!v)return;catFeatures.push(v);$("#cFeatInput").value="";renderFeatures();};

  err.textContent="";
  if(!u||!p){err.textContent="Введите логин и пароль";return;}
  btn.disabled=true;btn.textContent="Вход...";
  try{
    const res=await fetch(API_BASE+"/auth/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    if(!res.ok)throw new Error("bad");
    const data=await res.json();
    State.token=data.token||data.access_token;
    if(!State.token)throw new Error("notoken");
    State.adminName=data.name||u;
    localStorage.setItem("scenti_admin_token",State.token);
    localStorage.setItem("scenti_admin_name",State.adminName);
    enterApp();
  }catch(err2){
    // demo fallback login
    if(u==="admin"&&(p==="admin"||p==="admin123")){
      State.token="demo-token";State.adminName="Администратор";
      localStorage.setItem("scenti_admin_token",State.token);
      localStorage.setItem("scenti_admin_name",State.adminName);
      toast("Демо-режим (API недоступен)","warn");
      enterApp();
    }else{
      err.textContent="Неверный логин или пароль (демо: admin / admin)";
    }
  }finally{btn.disabled=false;btn.textContent="Войти";}
});
function logout(){
  State.token=null;
  localStorage.removeItem("scenti_admin_token");
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#loginPass").value="";
}
$("#logoutBtn").addEventListener("click",logout);

/* collapse */
$("#collapseIc").innerHTML=I.collapse;
$("#collapseBtn").addEventListener("click",()=>{
  document.body.classList.toggle("collapsed");
  localStorage.setItem("scenti_collapsed",document.body.classList.contains("collapsed")?"1":"");
});
if(localStorage.getItem("scenti_collapsed"))document.body.classList.add("collapsed");

function enterApp(){
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#topName").textContent=State.adminName;
  $("#topAvatar").textContent=initials(State.adminName);
  renderNav();
  go("dash");
}

/* auto-collapse on small screens */
function autoCollapse(){ if(window.innerWidth<1100)document.body.classList.add("collapsed"); }
window.addEventListener("resize",()=>{ if(window.innerWidth<1100)document.body.classList.add("collapsed"); });

/* boot */
if(State.token){ enterApp(); } else { $("#loginUser").focus(); }
autoCollapse();
</script>
</body>
</html>
