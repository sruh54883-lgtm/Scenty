<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenti — Супер-админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===================== TOKENS ===================== */
:root{
  --primary:#0E37A3;
  --light:#2E7BD6;
  --bg:#f0f4fb;
  --sidebar-bg:#0b0f1a;
  --card:#ffffff;
  --text:#16233F;
  --muted:#7C8BA5;
  --success:#1ec27f;
  --warning:#C98A2E;
  --danger:#D5564B;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(16,35,63,.06),0 1px 2px rgba(16,35,63,.04);
  --shadow-md:0 8px 24px rgba(16,35,63,.08);
  --shadow-lg:0 20px 50px rgba(16,35,63,.16);
  --sidebar-w:240px;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --t:.18s cubic-bezier(.4,0,.2,1);
}

/* ===================== RESET ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--light);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c7d2e3;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#a9b8d0}

/* ===================== UTILITY ===================== */
.hidden{display:none !important}
.row{display:flex;align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.spacer{flex:1}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* ===================== LOGIN ===================== */
#login{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#eef2f8;
  z-index:1000;
}
.login-header{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:#fff;border-bottom:1px solid #e4eaf4;
  display:flex;align-items:center;padding:0 28px;z-index:2;
}
.login-header-logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.login-header-logo .lh-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#0e37a3,#2e7bd6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;
}
.login-header-logo .lh-name{font-size:18px;font-weight:800;color:#0f1b35;letter-spacing:-.3px}
.login-card{
  width:420px;background:#fff;border-radius:18px;
  padding:44px 40px 40px;
  box-shadow:0 4px 40px rgba(14,55,163,.10),0 1px 4px rgba(0,0,0,.06);
  animation:pop .35s cubic-bezier(.34,1.56,.64,1);
}
.login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.login-brand-icon{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,#0e37a3,#2e7bd6);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:28px;font-weight:900;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(14,55,163,.28);
}
.login-brand-title{font-size:22px;font-weight:800;color:#0f1b35;margin-bottom:3px}
.login-brand-sub{font-size:13px;color:#8897b0;font-weight:500}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:#3a4a6b}
.input{
  width:100%;height:46px;border:1.5px solid #e1e8f2;border-radius:var(--radius-sm);
  padding:0 14px;background:#fafcff;transition:border var(--t),box-shadow var(--t);
}
textarea.input{height:auto;padding:12px 14px;resize:vertical;min-height:90px;line-height:1.55}
.input:focus{outline:none;border-color:var(--light);box-shadow:0 0 0 3px rgba(46,123,214,.14);background:#fff}
.btn{
  height:46px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 20px;transition:transform var(--t),box-shadow var(--t),background var(--t),opacity var(--t);
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(14,55,163,.28)}
.btn-primary:hover{background:#0c2f8c}
.btn-block{width:100%}
.btn-ghost{background:#eef3fb;color:var(--text)}
.btn-ghost:hover{background:#e3ebf7}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{filter:brightness(.95)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.95)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px}
.btn-icon svg{width:18px;height:18px;flex-shrink:0}
.btn svg{width:18px;height:18px;flex-shrink:0}
.login-error{color:var(--danger);font-size:13px;margin-top:4px;min-height:18px;font-weight:600}

/* ===================== APP SHELL ===================== */
#app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);color:#cdd6e6;
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  z-index:50;transition:width var(--t);
}
.sidebar .brand{
  display:flex;align-items:center;gap:10px;padding:22px 20px 18px;
}
.sidebar .brand .mark{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;
}
.sidebar .brand .name{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.4px;white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:#22293a;border:none}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:#9aa7be;font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:background var(--t),color var(--t);position:relative;
}
.nav-item .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .ic svg{width:18px;height:18px}
.nav-item:hover{background:#161c2b;color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;box-shadow:0 6px 16px rgba(14,55,163,.35)}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;
}
.nav-item.active .badge{background:#fff;color:var(--primary)}
.sidebar .foot{padding:12px;border-top:1px solid #1a2233}
.sidebar-collapse{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:#9aa7be;font-weight:600;font-size:13px;width:100%;
}
.sidebar-collapse:hover{background:#161c2b;color:#fff}

/* collapsed */
body.collapsed .sidebar{width:72px}
body.collapsed .sidebar .brand .name,
body.collapsed .nav-item span.label,
body.collapsed .sidebar-collapse span{display:none}
body.collapsed .nav-item{justify-content:center;padding:11px}
body.collapsed .nav-item .badge{position:absolute;top:4px;right:4px;margin:0}
body.collapsed .main{margin-left:72px}
body.collapsed .sidebar-collapse{justify-content:center}

.main{
  flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin var(--t);
  display:flex;flex-direction:column;min-height:100vh;
}
.topbar{
  height:64px;background:rgba(240,244,251,.85);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:30;display:flex;align-items:center;
  padding:0 28px;gap:16px;border-bottom:1px solid #e3eaf4;
}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.topbar .who{display:flex;align-items:center;gap:10px}
.avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--light));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.content{padding:24px 28px 48px;flex:1}

/* ===================== CARDS / STATS ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat{
  background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;transition:transform var(--t),box-shadow var(--t);cursor:pointer;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat .ico{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
}
.stat .ico svg{width:22px;height:22px}
.stat .label{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.stat .value{font-size:28px;font-weight:800;letter-spacing:-.6px}
.stat .value .cur{font-size:15px;font-weight:700;color:var(--muted);margin-left:4px}
.stat .pill{position:absolute;top:18px;right:18px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px}
.stat .trend{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.stat .trend.up{color:#16a34a}.stat .trend.down{color:#dc2626}.stat .trend.neu{color:var(--muted)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* ===================== DASH FILTER BAR ===================== */
.dash-filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.period-chips{display:flex;gap:6px;flex-wrap:wrap}
.period-chip{padding:7px 14px;border-radius:20px;border:1.5px solid #dde4f0;background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .18s;white-space:nowrap}
.period-chip:hover{border-color:var(--primary);color:var(--primary)}
.period-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.dash-filter-sep{width:1px;height:28px;background:#e3eaf4;margin:0 4px}
.dash-filter-range{display:flex;align-items:center;gap:8px}
.dash-filter-range label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dash-filter-range input[type=date]{padding:6px 10px;border:1.5px solid #dde4f0;border-radius:10px;font-size:13px;font-family:inherit;color:var(--dark);background:#fff;outline:none;cursor:pointer}
.dash-filter-range input[type=date]:focus{border-color:var(--primary)}
.dash-filter-actions{display:flex;gap:6px}
.btn-apply{padding:7px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;box-shadow:0 4px 12px rgba(14,55,163,.25)}
.btn-apply:hover{opacity:.85}
.btn-reset{padding:7px 14px;background:transparent;color:var(--muted);border:1.5px solid #dde4f0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-reset:hover{border-color:var(--danger);color:var(--danger)}

/* ===================== DRAWER ===================== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;opacity:0;transition:opacity .25s;pointer-events:none}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:95vw;background:#fff;z-index:1001;
  box-shadow:-8px 0 40px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.drawer-head h3{flex:1;font-size:17px;font-weight:800;letter-spacing:-.3px}
.drawer-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#f8f9fc;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:16px 22px}
.drawer-body table{width:100%;border-collapse:collapse;font-size:13px}
.drawer-body th{font-weight:700;color:var(--muted);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
.drawer-body td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.drawer-body tr:last-child td{border-bottom:none}
.drawer-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.drawer-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* ===================== DASH CHART ===================== */
.dash-chart-wrap{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.dash-chart-title{font-size:15px;font-weight:800;margin-bottom:14px;letter-spacing:-.3px}
.dash-chart-bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.dash-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.dash-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;transition:opacity .2s;cursor:default}
.dash-bar:hover{opacity:.8}
.dash-bar-label{font-size:10px;color:var(--muted);white-space:nowrap;margin-top:2px}
.dash-bar-val{font-size:11px;font-weight:800;color:var(--text)}
.dash-bar-sum{font-size:10px;font-weight:600;color:var(--success);white-space:nowrap}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card-pad{padding:22px}

/* ===================== TOOLBAR ===================== */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search{position:relative;flex:1;max-width:360px;min-width:200px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .input{padding-left:40px;height:42px;background:#fff}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.section-head h2{font-size:22px;font-weight:800;letter-spacing:-.5px}

/* ===================== TABS ===================== */
.tabs{display:inline-flex;background:#e6edf7;padding:4px;border-radius:12px;gap:2px;margin-bottom:18px}
.tab{
  padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);
  transition:all var(--t);display:flex;align-items:center;gap:7px;
}
.tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
.tab .cnt{background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:10px}
.tab.active .cnt{background:var(--primary)}

/* ===================== TABLE ===================== */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);padding:14px 18px;background:#f7faff;border-bottom:1px solid #eaf0f8;white-space:nowrap;
}
tbody td{padding:14px 18px;border-bottom:1px solid #f0f4fb;font-size:13.5px;vertical-align:middle}
tbody tr{transition:background var(--t)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f6f9ff}
tbody tr:last-child td{border-bottom:none}
tbody tr.removing{animation:rowOut .45s forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(40px);background:#eafaf2}}
.t-strong{font-weight:700}
.t-actions{display:flex;gap:8px;justify-content:flex-end}
.cell-user{display:flex;align-items:center;gap:11px}
.cell-user .avatar{width:34px;height:34px;font-size:13px}
.cell-user .meta b{display:block;font-weight:700;font-size:13.5px}
.cell-user .meta small{color:var(--muted);font-size:12px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#eef3fb;display:block}
.thumb-fallback{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#dbe6f7,#eef3fb);display:flex;align-items:center;justify-content:center;color:var(--light)}
.img-upload-wrap{display:flex;flex-direction:column;gap:6px}
.img-upload-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-size:13px;border:2px dashed var(--border);border-radius:10px;background:#f8fafd;color:var(--primary);cursor:pointer;transition:.15s}
.img-upload-btn:hover{background:#eef3fb;border-color:var(--primary)}
.img-upload-preview img{max-height:80px;border-radius:8px;object-fit:cover;margin-top:2px}

.badge-status{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
  padding:5px 11px;border-radius:20px;white-space:nowrap;
}
.badge-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending{background:#fdf3e3;color:var(--warning)}
.st-confirmed,.st-approved,.st-active,.st-issued{background:#e3f8ef;color:var(--success)}
.st-rejected,.st-inactive{background:#fbe9e7;color:var(--danger)}
.st-neutral{background:#eef3fb;color:var(--muted)}
.st-shipping{background:#e8f4fd;color:#1a6fb5}
.st-confirming{background:#f0e8fd;color:#7c3aed}

/* Rich-text broadcast editor */
.bc-toolbar{display:flex;gap:4px;background:#f5f7fa;border:1px solid var(--border);border-bottom:none;padding:6px 8px;border-radius:10px 10px 0 0}
.bc-tb-btn{background:none;border:1px solid transparent;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text);font-family:inherit;line-height:1.4;transition:background .15s}
.bc-tb-btn:hover{background:#e8edf5;border-color:var(--border)}
.bc-tb-btn.bc-tb-clear{font-style:italic;font-size:12px;color:var(--muted)}
.bc-editor{min-height:110px;border:1px solid var(--border);border-radius:0 0 10px 10px;padding:12px 14px;font-size:14px;line-height:1.6;outline:none;background:#fff;word-break:break-word}
.bc-editor:empty:before{content:attr(placeholder);color:var(--muted);pointer-events:none}
.bc-editor:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.07)}
.bc-editor a{color:var(--primary);text-decoration:underline}
.tag{display:inline-block;background:#eef3fb;color:var(--light);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;color:var(--text);font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px}
.chip button{color:var(--muted);font-size:14px;line-height:1;display:flex}
.chip button:hover{color:var(--danger)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* pagination */
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid #f0f4fb}
.pager .info{color:var(--muted);font-size:13px}
.pager .pages{display:flex;gap:6px}
.pg-btn{
  min-width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid #e1e8f2;
  font-weight:700;font-size:13px;color:var(--text);transition:all var(--t);padding:0 8px;
}
.pg-btn:hover:not(:disabled){border-color:var(--light);color:var(--light)}
.pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

/* ===================== TOGGLE SWITCH ===================== */
.switch{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#cdd8ea;border-radius:20px;transition:var(--t)}
.switch .slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--success)}
.switch input:checked+.slider::before{transform:translateX(18px)}

/* ===================== MODAL ===================== */
.overlay{
  position:fixed;inset:0;background:rgba(11,15,26,.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;z-index:200;
  opacity:0;animation:fade .2s forwards;overflow-y:auto;
}
.modal{
  background:var(--card);border-radius:var(--radius-lg);width:560px;max-width:100%;
  box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;max-height:calc(100vh - 96px);
}
.modal.wide{width:760px}
.modal-head{display:flex;align-items:center;gap:14px;padding:22px 24px 16px;border-bottom:1px solid #eef3fb}
.modal-head h3{font-size:19px;font-weight:800;letter-spacing:-.4px}
.modal-head .x{margin-left:auto;width:34px;height:34px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:var(--t)}
.modal-head .x:hover{background:#f0f4fb;color:var(--text)}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid #eef3fb;display:flex;gap:10px;justify-content:flex-end}
.modal-foot.between{justify-content:space-between}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.check-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.check-row label{font-weight:600;cursor:pointer}
.sub-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 10px}

.kv-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.chips-edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* detail blocks */
.detail-hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.detail-hero .avatar{width:54px;height:54px;font-size:20px}
.detail-hero b{font-size:18px;font-weight:800;display:block}
.balance-box{
  background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;border-radius:var(--radius);
  padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px;
}
.balance-box .lab{font-size:12.5px;opacity:.85;font-weight:600}
.balance-box .num{font-size:24px;font-weight:800}
.txn-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.txn-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#f7faff;border-radius:11px}
.txn-item .amt{margin-left:auto;text-align:right}
.txn-item .amt b{display:block;font-weight:800}
.txn-item .amt small{color:var(--muted);font-size:11.5px}

/* multi-select districts */
.ms-box{border:1.5px solid #e1e8f2;border-radius:var(--radius-sm);padding:10px;max-height:200px;overflow-y:auto;background:#fafcff}
.ms-group{margin-bottom:8px}
.ms-group>strong{font-size:12px;color:var(--muted);display:block;margin:4px 0 6px;font-weight:800}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer}
.ms-opt:hover{background:#eef3fb}
.ms-opt input{width:16px;height:16px;accent-color:var(--primary)}
/* Двухуровневый выбор районов */
.ag-pick{border:1.5px solid #e1e8f2;border-radius:var(--radius-sm);background:#fafcff;overflow:hidden}
.ag-region-row{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px;border-bottom:1px solid #f0f3f8;transition:background .15s}
.ag-region-row:last-child{border-bottom:none}
.ag-region-row:hover{background:#eef3fb}
.ag-region-name{flex:1;font-size:14px;font-weight:600}
.ag-region-cnt{min-width:22px;height:22px;border-radius:11px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.ag-region-chev{color:var(--muted);flex-shrink:0}
.ag-back-row{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;border-bottom:2px solid #e1e8f2;font-weight:700;font-size:14px;color:var(--primary)}
.ag-back-row:hover{background:#eef3fb}
.ag-dist-list{max-height:260px;overflow-y:auto}
.ag-dist-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f3f8;transition:background .15s}
.ag-dist-item:last-child{border-bottom:none}
.ag-dist-item:hover{background:#eef3fb}
.ag-dist-item input{width:17px;height:17px;accent-color:var(--primary);flex-shrink:0}
.ag-dist-item span{font-size:14px}

/* ===================== TOASTS ===================== */
#toasts{position:fixed;top:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:10px}
.toast{
  background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);padding:13px 16px;
  display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;
  border-left:4px solid var(--success);animation:slideIn .3s cubic-bezier(.34,1.56,.64,1);
}
.toast.out{animation:slideOut .3s forwards}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast .tic{width:22px;height:22px;flex-shrink:0}
.toast b{display:block;font-weight:700;font-size:13.5px}
.toast small{color:var(--muted);font-size:12px}

@keyframes slideIn{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(120%)}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}

/* settings page */
.setting-card{max-width:720px}
.info-banner{display:flex;gap:11px;align-items:center;background:#eaf2ff;color:var(--primary);padding:13px 16px;border-radius:12px;font-size:13px;font-weight:600;margin-top:16px}
.info-banner svg{width:20px;height:20px;flex-shrink:0}

.backup-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#f7faff;border-radius:12px;margin-bottom:9px}
.backup-item .fic{width:38px;height:38px;border-radius:10px;background:#eaf2ff;color:var(--primary);display:flex;align-items:center;justify-content:center}

.skeleton{background:linear-gradient(90deg,#eef3fb 25%,#f6f9ff 50%,#eef3fb 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ===================== LOADING STATES ===================== */
/* Top progress bar */
#nprogress{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;pointer-events:none}
#nprogress .bar{height:3px;background:var(--light);width:0;transition:width .25s ease;border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(46,123,214,.6)}
#nprogress.done .bar{width:100%;opacity:0;transition:width .2s ease,opacity .3s .1s ease}

/* Full-screen boot spinner */
#boot-loader{position:fixed;inset:0;background:#f0f4fb;z-index:8888;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#boot-loader.hide{opacity:0;pointer-events:none}
.boot-logo{width:54px;height:54px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800;box-shadow:0 8px 24px rgba(14,55,163,.25)}
.boot-spinner{width:36px;height:36px;border:3px solid #dce8f9;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
.boot-text{font-size:13px;color:var(--muted);font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}

/* Content area loading pulse */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;gap:14px;color:var(--muted);font-size:13px;font-weight:500}
.page-loading .spin{width:28px;height:28px;border:2.5px solid #dce8f9;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}

/* ===================== DASHBOARD MAP ===================== */
.dash-grid{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start;margin-top:0}
#dash-map{height:520px;border-radius:12px;overflow:hidden;background:#e8f0fc}
#dash-map .leaflet-control-attribution{display:none}
.leaflet-container{font-family:var(--font)!important;font-size:13px!important}
.leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 4px 24px rgba(30,60,120,.14)!important}
.leaflet-tooltip{background:#fff!important;border:1px solid #dce8f9!important;border-radius:10px!important;box-shadow:0 4px 12px rgba(30,60,120,.12)!important;padding:6px 12px!important;font-size:13px!important;color:#0f1b35!important}
.leaflet-tooltip::before{display:none!important}
.leaflet-control-zoom a{border-radius:8px!important;border:1px solid #dce8f9!important;color:#374b6e!important;font-size:16px!important}
.leaflet-control-zoom{border:none!important;box-shadow:0 2px 8px rgba(30,60,120,.12)!important;border-radius:10px!important;overflow:hidden!important}
</style>

  return dt.toLocaleDateString("ru-RU",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtDateTime(d){
  const dt = new Date(d);
  if(isNaN(dt)) return d||"—";
  return dt.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})+" "+dt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}

/* Генерирует HTML виджета загрузки картинки. fieldId — id скрытого input с url */
function imgUploadWidget(fieldId, currentUrl=""){
  const uid = fieldId+"_file";
  return `<div class="img-upload-wrap" id="${fieldId}_wrap">
    <input type="hidden" id="${fieldId}" value="${esc(currentUrl)}">
    <div class="img-upload-preview" id="${fieldId}_preview">
      ${currentUrl?`<img src="${esc(currentUrl)}" onerror="this.style.display='none'">`:''}
    </div>
    <label class="btn btn-ghost img-upload-btn" for="${uid}" style="cursor:pointer">
      ${I.file||'📎'} <span>Загрузить картинку</span>
    </label>
    <input type="file" id="${uid}" accept="image/*" style="display:none"
      onchange="uploadImgFile(this,'${fieldId}')">
    <div class="img-upload-hint" id="${fieldId}_hint" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
  </div>`;
}

async function uploadImgFile(input, fieldId){
  const file = input.files[0];
  if(!file) return;
  const hint = $("#"+fieldId+"_hint");
  const preview = $("#"+fieldId+"_preview");
  hint.textContent = "Загружаем...";
  try{
    const fd = new FormData();
    fd.append("file", file);
    const headers = {};
    if(State.token && State.token!=="demo-token") headers["Authorization"]="Bearer "+State.token;
    const res = await fetch(API_BASE+"/admin/upload", {method:"POST", headers, body:fd});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const url = data.url;
    $("#"+fieldId).value = url;
    preview.innerHTML = `<img src="${esc(url)}" style="max-height:80px;border-radius:6px;margin-top:4px">`;
    hint.textContent = "✅ Загружено";
  }catch(e){
    hint.textContent = "❌ Ошибка загрузки";
    toast("Ошибка загрузки файла","err");
  }
}

/* ---------- TOASTS ---------- */
function toast(msg, type="ok", sub=""){
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast "+(type==="err"?"err":type==="warn"?"warn":"");
  const ic = type==="err"?I.x:type==="warn"?I.bell:I.check;
  const col = type==="err"?"var(--danger)":type==="warn"?"var(--warning)":"var(--success)";
  el.innerHTML = `<div class="tic" style="color:${col}">${ic}</div><div><b>${esc(msg)}</b>${sub?`<small>${esc(sub)}</small>`:""}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),300);},3200);
}

/* ---------- API ---------- */
async function api(path, opts={}){
  if(State.token==="demo-token") throw new Error("demo");
  const isFormData = opts.body instanceof FormData;
  const headers = isFormData ? {} : Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(State.token) headers["Authorization"] = "Bearer "+State.token;
  const {_raw, ...fetchOpts} = opts;
  const res = await fetch(API_BASE+path, Object.assign({}, fetchOpts, {headers}));
  if(res.status===401){ logout(); throw new Error("401"); }
  if(!res.ok){ throw new Error("HTTP "+res.status); }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : res.text();
}
// api with mock fallback
async function apiOrMock(path, _unused, opts){
  const r = await api(path, opts);
  if(r && !Array.isArray(r) && Array.isArray(r.data)) return r.data;
  return r;
}

   ============================================================ */
function paginate(arr, page, per=20){
  const total = arr.length, pages = Math.max(1, Math.ceil(total/per));
  const cur = Math.min(Math.max(1,page), pages);
  return {items:arr.slice((cur-1)*per, cur*per), cur, pages, total, per};
}
function pagerHTML(p, fn){
  if(p.pages<=1) return `<div class="pager"><div class="info">${p.total} записей</div></div>`;
  let btns="";
  for(let i=1;i<=p.pages;i++){
    btns+=`<button class="pg-btn ${i===p.cur?'active':''}" onclick="${fn}(${i})">${i}</button>`;
  }
  const from=(p.cur-1)*p.per+1, to=Math.min(p.cur*p.per,p.total);
  return `<div class="pager"><div class="info">${from}–${to} из ${p.total}</div><div class="pages">
    <button class="pg-btn" onclick="${fn}(${p.cur-1})" ${p.cur===1?'disabled':''}>‹</button>${btns}
    <button class="pg-btn" onclick="${fn}(${p.cur+1})" ${p.cur===p.pages?'disabled':''}>›</button></div></div>`;
}

let _dashMap = null;

function _dashDates(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(_dashPeriod==='7d'){
    const f=new Date(now); f.setDate(f.getDate()-6);
    return {df:fmt(f), dt:fmt(now)};
  }
  if(_dashPeriod==='30d'){
    const f=new Date(now); f.setDate(f.getDate()-29);
    return {df:fmt(f), dt:fmt(now)};
  }
  if(_dashPeriod==='prev_month'){
    const f=new Date(now.getFullYear(), now.getMonth()-1, 1);
    const t=new Date(now.getFullYear(), now.getMonth(), 0);
    return {df:fmt(f), dt:fmt(t)};
  }
  if(_dashPeriod==='custom') return {df:_dashFrom, dt:_dashTo};
  return {df:'', dt:''}; // all
}

      pill:(s.pending_transactions??pending.length)>0?`<span class="pill" style="background:var(--danger);color:#fff;position:absolute;top:14px;right:14px;font-size:10px">срочно</span>`:"",
    },
  ];

  function renderStatCard(s){
    return `<div class="stat" onclick="openDrawer('${s.detail}')">
      ${s.pill||""}
      <div class="ico" style="background:${s.bg};color:${s.col}">${s.ic}</div>
      <div class="label">${s.label}</div>
      <div class="value">${s.val}${s.cur?`<span class="cur">${s.cur}</span>`:""}</div>
      ${s.sub?`<div class="stat-sub">${s.sub}</div>`:""}
      <div style="position:absolute;bottom:14px;right:14px;color:var(--muted);opacity:.4">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>`;
  }

  $("#dashStats1").innerHTML = row1.map(renderStatCard).join("");
  $("#dashStats2").innerHTML = row2.map(renderStatCard).join("");

  // --- CHART: по месяцам ---
  const chart = s.monthly_chart||[];
  const chartEl = $("#dashChart");
  chartEl.style.display="";
  const MONTHS_RU=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  if(!chart.length){
    chartEl.innerHTML=`<div class="dash-chart-title">Продажи по месяцам</div><div style="color:var(--muted);text-align:center;padding:30px">Нет данных</div>`;
  }else{
    const maxAmt=Math.max(1,...chart.map(d=>d.total_amount));
    const fmtM=v=>v>=1000000?(v/1000000).toFixed(1).replace(/\.0$/,'')+'М':v>=1000?Math.round(v/1000)+'К':String(Math.round(v));
    // Рост/спад: сравниваем с предыдущим месяцем
    const bars=chart.map((d,i)=>{
      const prev=i>0?chart[i-1].total_amount:null;
      const pct=Math.round((d.total_amount/maxAmt)*100);
      const [yr,mn]=d.month.split('-');
      const label=MONTHS_RU[parseInt(mn,10)-1]+' '+yr.slice(2);
      let trend='';
      if(prev!==null&&prev>0){
        const diff=Math.round((d.total_amount-prev)/prev*100);
        const col=diff>=0?'#16a34a':'#dc2626';
        const arrow=diff>=0?'▲':'▼';
        trend=`<div style="font-size:10px;font-weight:700;color:${col};margin-bottom:2px">${arrow}${Math.abs(diff)}%</div>`;
      }
      const barColor=i>0&&d.total_amount<chart[i-1].total_amount?'#dc2626':'var(--primary)';
      return `<div class="dash-bar-col" style="min-width:0;flex:1">
        ${trend}
        <div class="dash-bar-val" style="font-size:11px">${d.txn_count}<span style="font-size:9px;color:var(--muted)"> шт</span></div>
        <div class="dash-bar" style="height:${Math.max(6,pct*0.75)}px;background:${barColor};border-radius:4px 4px 0 0;opacity:.85" title="${d.month}: ${fmt(d.total_amount)} сум · ${d.txn_count} транзакций"></div>
        <div class="dash-bar-sum" style="font-size:10px">${fmtM(d.total_amount)}</div>
        <div class="dash-bar-label" style="font-size:10px">${label}</div>
      </div>`;
    }).join('');
    chartEl.innerHTML=`
      <div class="dash-chart-title" style="margin-bottom:16px">Продажи по месяцам <span style="font-size:12px;font-weight:600;color:var(--muted)">(последние 12 мес.)</span></div>
      <div class="dash-chart-bars" style="align-items:flex-end;gap:6px;height:130px">${bars}</div>`;
  }

  // Map: load per-region stats from dedicated endpoint
  let regionStats = [];
  try{
    const {df:rdf,dt:rdt}=_dashDates();
    const rqs=[rdf?`date_from=${rdf}`:'',rdt?`date_to=${rdt}`:''].filter(Boolean).join('&');
    regionStats = await api(`/admin/stats/regions${rqs?'?'+rqs:''}`);
  }catch(e){ /* fallback to empty */ }
  // Fallback: build from users if endpoint failed
  if(!regionStats.length && uArr.length){
    const byR={};
    uArr.forEach(u=>{ const rn=u.region||u.region_name||""; if(rn) byR[rn]=(byR[rn]||0)+1; });
    regionStats=Object.entries(byR).map(([name_ru,clients])=>({name_ru,clients,earned:0}));
  }
  initDashMap(regionStats);

  // Pending transactions list
  const dt = $("#dashTxn");
  if(!pending.length){
    dt.innerHTML = `<div class="empty">${I.check}<div>Нет ожидающих транзакций</div></div>`;
  } else {
    dt.innerHTML = `<div class="txn-list" style="max-height:340px">${pending.slice(0,8).map(t=>`
      <div class="txn-item">
        <div class="avatar" style="width:36px;height:36px;font-size:13px">${initials(t.user_name)}</div>
        <div><b style="font-weight:700;display:block">${esc(t.user_name)}</b><small class="muted">${esc(t.agent_name||"—")} · ${fmtDate(t.created_at)}</small></div>
        <div class="amt"><b>${fmtSum(t.amount)}</b><small>+${fmtSum(t.cashback)}</small></div>
      </div>`).join("")}</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;width:100%" onclick="go('txns')">Все транзакции →</button>`;
  }
}

function initDashMap(regionStats){
  const el = $("#dash-map");
  if(!el || typeof L === "undefined") return;
  if(_dashMap){_dashMap.remove();_dashMap=null;}

  const UZ_COORDS = {
    "Город Ташкент":             {lat:41.2995,lng:69.2401},
    "Ташкентская область":       {lat:41.1,   lng:69.9},
    "Самаркандская область":     {lat:39.6547,lng:66.9597},
    "Бухарская область":         {lat:39.7681,lng:64.4556},
    "Ферганская область":        {lat:40.3842,lng:71.7843},
    "Андижанская область":       {lat:40.7829,lng:72.3442},
    "Наманганская область":      {lat:41.0011,lng:71.6558},
    "Кашкадарьинская область":   {lat:38.862, lng:65.7928},
    "Сурхандарьинская область":  {lat:37.940, lng:67.5676},
    "Навоийская область":        {lat:40.100, lng:65.3828},
    "Хорезмская область":        {lat:41.556, lng:60.6239},
    "Джизакская область":        {lat:40.116, lng:67.8422},
    "Сырдарьинская область":     {lat:40.840, lng:68.6633},
    "Республика Каракалпакстан": {lat:43.730, lng:59.0143},
  };

  // Узбекистан: строго ограничиваем карту
  const UZ_BOUNDS = L.latLngBounds([[36.6, 55.5], [46.2, 74.0]]);

  _dashMap = L.map(el, {
    zoomControl: true,
    scrollWheelZoom: false,
    attributionControl: false,
    minZoom: 6,
    maxZoom: 9,
    maxBounds: UZ_BOUNDS,
    maxBoundsViscosity: 1.0,
  });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", {
    maxZoom: 9,
  }).addTo(_dashMap);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png", {
    maxZoom: 9, pane: "shadowPane",
  }).addTo(_dashMap);

  // Индексируем по name_ru
  const byName = {};
  (regionStats||[]).forEach(r=>{ byName[r.name_ru]=r; });

  const maxClients = Math.max(1, ...(regionStats||[]).map(r=>r.clients||0));

  // Все известные регионы (из UZ_COORDS)
  Object.entries(UZ_COORDS).forEach(([name, coord])=>{
    const data = byName[name] || {clients:0, earned:0};
    const count = data.clients || 0;
    const earned = data.earned || 0;
    const hasData = count > 0;

    // Клиентов: склонение
    const cl = count===1?'клиент':count>1&&count<5?'клиента':'клиентов';
    // Заработано: форматируем
    const earnedFmt = earned>=1000000
      ? (earned/1000000).toFixed(1).replace(/\.0$/,'')+'M сум'
      : earned>=1000
        ? Math.round(earned/1000)+'K сум'
        : earned+' сум';

    const tip = `<div style="min-width:160px">
      <div style="font-weight:800;font-size:13px;color:#0f1b35;margin-bottom:5px">${name}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        <span style="width:8px;height:8px;border-radius:50%;background:#3B82F6;display:inline-block;flex-shrink:0"></span>
        <span style="font-size:12px;color:#374b6e">Клиентов: <b style="color:#1D4ED8">${count} ${cl}</b></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0"></span>
        <span style="font-size:12px;color:#374b6e">Заработано: <b style="color:#16a34a">${earned>0?earnedFmt:'—'}</b></span>
      </div>
    </div>`;

    if(hasData){
      const radius = 6 + Math.round((count / maxClients) * 16);
      // Glow ring
      L.circleMarker([coord.lat, coord.lng], {
        radius: radius + 5,
        color:"transparent", fillColor:"#3B82F6", fillOpacity:0.13, weight:0, interactive:false,
      }).addTo(_dashMap);
      // Main bubble
      L.circleMarker([coord.lat, coord.lng], {
        radius, color:"#1D4ED8", fillColor:"#3B82F6", weight:2, opacity:0.95, fillOpacity:0.78,
      })
      .bindTooltip(tip, {sticky:true, direction:"top", offset:[0,-4]})
      .addTo(_dashMap);
    } else {
      L.circleMarker([coord.lat, coord.lng], {
        radius:5, color:"#94a3b8", fillColor:"#cbd5e1", weight:1, opacity:0.5, fillOpacity:0.35,
      })
      .bindTooltip(tip, {sticky:true, direction:"top", offset:[0,-4]})
      .addTo(_dashMap);
    }
  });

  _dashMap.fitBounds([[37.0, 56.0], [45.8, 73.2]], {padding:[16,16], animate:false});
}

  try{
    await api("/admin/users/"+id, {method:"DELETE"});
    Clients.list = Clients.list.filter(x=>x.id!==id);
    renderUsers(); toast("Клиент удалён","warn");

        <input class="input" id="ctxAmount" type="number" min="1" step="1000" placeholder="Например: 500000">
      </div>
      <div id="ctxCashbackPreview" style="display:none;background:var(--success);color:#fff;border-radius:var(--radius-sm);padding:11px 14px;font-weight:700;font-size:15px">
        💰 Кешбэк: <span id="ctxCashbackVal">0</span> UZS (10%)
      </div>
      <div>
        <label class="form-label">Примечание (необязательно)</label>
        <input class="input" id="ctxNote" placeholder="Например: Продажа в шоуруме">
      </div>
    </div>`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-primary" id="ctxDo">${I.plus} Создать транзакцию</button>`;
  openModal(modalShell("Создать транзакцию",body,foot));

  let allUsers=[], selectedUserId=null, dropOpen=false;

  function userLabel(u){
    const name=(u.first_name||u.name||"").trim()+(u.last_name&&!u.name?" "+u.last_name:"");
    const uname=u.username?` @${u.username}`:"";
    const tg=u.telegram_id?` · tg ${u.telegram_id}`:"";
    return `#${u.id}${tg} · ${name||"—"}${uname}`;
  }

  function renderList(q){
    const list=$("#ctxList"); if(!list)return;
    const low=q.toLowerCase();
    const matches=!q?allUsers:allUsers.filter(u=>{
      return (u.first_name||"").toLowerCase().includes(low)
          || (u.last_name||"").toLowerCase().includes(low)
          || (u.name||"").toLowerCase().includes(low)
          || (u.username||"").toLowerCase().includes(low)
          || (u.phone||"").includes(q)
          || String(u.telegram_id||"").includes(q)
          || String(u.id).includes(q);
    });
    if(!matches.length){
      list.innerHTML=`<div style="padding:12px 14px;color:var(--muted);font-size:13px">Не найдено</div>`;
      return;
    }
    list.innerHTML=matches.slice(0,50).map(u=>`
      <div class="ctx-item" data-id="${u.id}" onclick="ctxSelect(${u.id})" style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f4fb;transition:background .12s">
        <span style="font-weight:700;color:var(--primary)">#${u.id}</span>
        ${u.telegram_id?`<span style="color:var(--muted)"> · tg ${u.telegram_id}</span>`:""}
        <span style="margin-left:4px">${esc((u.first_name||u.name||"").trim()+(u.last_name&&!u.name?" "+u.last_name:""))||"—"}</span>
        ${u.username?`<span style="color:var(--muted)"> @${esc(u.username)}</span>`:""}
      </div>`).join("");
    // hover
    list.querySelectorAll(".ctx-item").forEach(el=>{
      el.onmouseenter=()=>el.style.background="#f0f4fb";
      el.onmouseleave=()=>el.style.background=selectedUserId==el.dataset.id?"#2E7BD6":"";
    });
    // highlight selected
    if(selectedUserId){
      const sel=list.querySelector(`[data-id="${selectedUserId}"]`);
      if(sel)sel.style.background="#2E7BD6",sel.style.color="#fff";
    }
  }

  window.ctxToggle=function(){
    dropOpen=!dropOpen;
    const drop=$("#ctxDrop"),arrow=$("#ctxArrow");
    drop.style.display=dropOpen?"block":"none";
    arrow.style.transform=dropOpen?"rotate(180deg)":"";
    if(dropOpen){setTimeout(()=>$("#ctxSearch")&&$("#ctxSearch").focus(),50);}
  };

  window.ctxSelect=function(id){
    selectedUserId=id;
    const u=allUsers.find(x=>x.id===id);
    if(u){
      $("#ctxTriggerText").textContent=userLabel(u);
      $("#ctxTriggerText").style.color="var(--text)";
      $("#ctxUserId").value=id;
    }
    // close
    dropOpen=false;
    $("#ctxDrop").style.display="none";
    $("#ctxArrow").style.transform="";
    // re-render to show selection
    renderList($("#ctxSearch")?$("#ctxSearch").value:"");
  };

  // close on outside click
  setTimeout(()=>{
    document.addEventListener("click",function outsideCtx(e){
      if(!e.target.closest("#ctxDropWrap")){
        dropOpen=false;
        const d=$("#ctxDrop"); if(d)d.style.display="none";
        const a=$("#ctxArrow"); if(a)a.style.transform="";
        document.removeEventListener("click",outsideCtx);
      }
    });
  },100);

  // load users
  try{
    const r=await api("/admin/users?limit=1000");
    allUsers=(r.data||r.items||[]);
  }catch(e){ allUsers=[]; }
  renderList("");

  const srch=$("#ctxSearch");
  if(srch)srch.oninput=e=>renderList(e.target.value);

  const amtEl=$("#ctxAmount");
  if(amtEl)amtEl.oninput=function(){
    const v=parseFloat(this.value)||0;
    const cb=Math.round(v*0.10);
    const prev=$("#ctxCashbackPreview");
    if(prev)prev.style.display=cb>0?"block":"none";
    const val=$("#ctxCashbackVal");
    if(val)val.textContent=cb.toLocaleString("ru-RU");
  };

  const doBtn=$("#ctxDo");
  if(doBtn)doBtn.onclick=async function(){
    const userId=parseInt($("#ctxUserId").value||"0");
    const amount=parseFloat(amtEl?amtEl.value:0);
    const note=$("#ctxNote")?$("#ctxNote").value.trim():"";
    if(!userId){toast("Выберите клиента","err");return;}
    if(!amount||amount<=0){toast("Введите сумму покупки","err");return;}
    this.disabled=true; this.textContent="Создаём…";
    try{
      const r=await api("/admin/transactions",{method:"POST",body:JSON.stringify({user_id:userId,amount,note})});
      closeModal();
      toast("Транзакция создана","ok",`Кешбэк ${Math.round(r.cashback_amount??r.cashback??0).toLocaleString("ru-RU")} UZS — ожидает подтверждения`);
      const data=await apiOrMock("/admin/transactions",()=>MOCK.txns);
      Txns.list=Array.isArray(data)?data:(data?.items||[]);
      Badges.pendingTxn=Txns.list.filter(t=>t.status==="pending").length;
      renderNav(); renderTxns();
    }catch(e){
      this.disabled=false; this.innerHTML=`${I.plus} Создать транзакцию`;
      toast("Ошибка","err",e.message||"Проверьте данные");
    }
  };
};
function renderTxns(){
  const counts={pending:0,approved:0,rejected:0};
  Txns.list.forEach(t=>{if(t.status==="confirmed")counts.approved++;else if(counts[t.status]!==undefined)counts[t.status]++;});
  $("#txnTabs").innerHTML=`<div class="tabs">
    <div class="tab ${Txns.tab==='pending'?'active':''}" onclick="txnTab('pending')">Ожидают ${counts.pending?`<span class="cnt">${counts.pending}</span>`:""}</div>
    <div class="tab ${Txns.tab==='approved'?'active':''}" onclick="txnTab('approved')">Подтверждённые</div>
    <div class="tab ${Txns.tab==='rejected'?'active':''}" onclick="txnTab('rejected')">Отклонённые</div>
  </div>`;
  const arr=Txns.list.filter(t=>Txns.tab==='approved'?(t.status==='approved'||t.status==='confirmed'):t.status===Txns.tab);
  const p=paginate(arr,Txns.page,20);
  const body=$("#txnBody"); if(!body)return;
  if(!p.items.length){body.innerHTML=emptyRow(7,"Нет транзакций");$("#txnPager").innerHTML="";return;}
  body.innerHTML=p.items.map(t=>`
    <tr data-id="${t.id}">
      <td><div class="cell-user"><div class="avatar">${initials(t.user_name)}</div><div class="meta"><b>${esc(t.user_name)}</b></div></div></td>
      <td>${esc(t.agent_name||"—")}</td>
      <td class="t-strong mono">${fmtSum(t.amount)}</td>
      <td class="mono" style="color:var(--success);font-weight:700">${fmtSum(t.cashback_amount??t.cashback??0)}</td>
      <td class="muted nowrap">${fmtDateTime(t.created_at)}</td>
      <td><span class="badge-status st-${(t.status==='approved'||t.status==='confirmed')?'approved':t.status==='rejected'?'rejected':'pending'}">${txnStatusRu(t.status)}</span></td>
      <td class="t-actions">${t.status==='pending'
        ? `<button class="btn btn-success btn-sm" onclick="txnConfirm(${t.id})">${I.check}<span style="margin-left:2px">Подтвердить</span></button>
           <button class="btn btn-ghost btn-sm" onclick="txnReject(${t.id})" style="color:var(--danger);font-size:12px">Отклонить</button>`
        : t.reason?`<span class="muted" title="${esc(t.reason)}">${esc(t.reason)}</span>`:""}</td>
    </tr>`).join("");
  $("#txnPager").innerHTML=pagerHTML(p,"txnGo");
}
window.txnTab=t=>{Txns.tab=t;Txns.page=1;renderTxns();};
window.txnGo=p=>{Txns.page=p;renderTxns();};
window.txnConfirm=async id=>{
  const t=Txns.list.find(x=>x.id===id);
  const cashback=t?fmtSum(t.cashback):"";
  const client=t?esc(t.user_name):"";
  const body=`<p style="margin:0 0 8px">Вы подтверждаете транзакцию?</p>
    <div style="background:var(--bg);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7">
      <b>${client}</b><br>
      Кешбэк: <span style="color:var(--success);font-weight:700">${cashback}</span> будет зачислен на счёт клиента
    </div>`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-success" id="txnConfirmDo">Да, подтвердить</button>`;
  openModal(modalShell("Подтвердить транзакцию",body,foot));
  $("#txnConfirmDo").onclick=async()=>{
    $("#txnConfirmDo").disabled=true; $("#txnConfirmDo").textContent="Подтверждаем…";
    try{
      await api("/admin/transactions/"+id+"/approve",{method:"POST"});
      closeModal();
      if(t) t.status="approved";
      const row=$(`#txnBody tr[data-id="${id}"]`);
      if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingTxn=Txns.list.filter(x=>x.status==="pending").length;renderNav();renderTxns();},450);}
      toast("Транзакция подтверждена","ok","Кешбэк начислен клиенту");
    }catch(e){
      $("#txnConfirmDo").disabled=false; $("#txnConfirmDo").textContent="Да, подтвердить";
      if(e.message==="401")return;
      toast("Ошибка подтверждения","err");
    }
  };
};
window.txnReject=id=>{
  const body=`<p style="margin-bottom:14px;color:var(--muted)">Укажите причину отклонения — клиент увидит её.</p>
    <textarea class="input" id="rejReason" placeholder="Например: фото чека нечитаемо"></textarea>`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-danger" id="rejDo">Отклонить транзакцию</button>`;
  openModal(modalShell("Отклонить транзакцию",body,foot));
  $("#rejDo").onclick=async()=>{
    const reason=$("#rejReason").value.trim();
    if(!reason){toast("Введите причину","err");return;}
    $("#rejDo").disabled=true; $("#rejDo").textContent="Отклоняем…";
    try{
      await api("/admin/transactions/"+id+"/reject",{method:"POST",body:JSON.stringify({note:reason})});
      const t=Txns.list.find(x=>x.id===id); if(t){t.status="rejected";t.reason=reason;}
      closeModal();
      const row=$(`#txnBody tr[data-id="${id}"]`);
      if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingTxn=Txns.list.filter(x=>x.status==="pending").length;renderNav();renderTxns();},450);}
      toast("Транзакция отклонена","warn");
    }catch(e){
      $("#rejDo").disabled=false; $("#rejDo").textContent="Отклонить транзакцию";
      if(e.message==="401")return;
      toast("Ошибка отклонения","err");
    }
  };
};

function _thumbColor(name){
  const h=[...((name||'')+'X')].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  return {bg:`hsl(${h},55%,88%)`,col:`hsl(${h},50%,32%)`};
}
function thumb(url,name){
  if(url) return `<img class="thumb" src="${esc(url)}" onerror="this.outerHTML=thumb('','${esc(name||'')}')">`;
  const {bg,col}=_thumbColor(name);
  const letter=(name||'?')[0].toUpperCase();
  return `<div class="thumb-fallback" style="background:${bg};color:${col};font-weight:800;font-size:19px">${letter}</div>`;
}
function renderGifts(){
  const body=$("#gBody"); if(!body)return;
  if(!Gifts.list.length){body.innerHTML=emptyRow(6,"Нет подарков");return;}
  body.innerHTML=Gifts.list.map(g=>`
    <tr>
      <td>${thumb(g.image_url,g.name_ru)}</td>
      <td><div class="t-strong">${esc(g.name_ru)}</div><small class="muted">${esc(g.name_uz||"")}</small></td>
      <td class="t-strong mono">${fmtSum(g.price_cashback)}</td>
      <td>${g.stock_quantity==null?'<span class="tag">∞ безлимит</span>':`<span>${g.stock_quantity} шт</span>`}</td>
      <td><span class="badge-status ${g.is_active?'st-active':'st-inactive'}">${g.is_active?'Активен':'Скрыт'}</span></td>
      <td class="t-actions">
        <button class="btn btn-ghost btn-sm btn-icon" title="Редактировать" onclick="giftEdit(${g.id})">${I.eye}</button>
        <button class="btn btn-ghost btn-sm" onclick="giftToggle(${g.id})">${g.is_active?'Скрыть':'Показать'}</button>
        <button class="btn btn-ghost btn-sm btn-icon" title="Удалить" style="color:var(--danger)" onclick="giftDelete(${g.id},'${esc(g.name_ru)}')">${I.trash}</button>
      </td></tr>`).join("");
}
window.giftDelete=async(id,name)=>{
  if(!confirm(`Удалить подарок «${name}»? Действие необратимо.`)) return;
  try{
    await api("/admin/gifts/"+id,{method:"DELETE"});
    Gifts.list=Gifts.list.filter(x=>x.id!==id);
    renderGifts(); toast("Подарок удалён","warn");
  }catch(e){ if(e.message==="401")return; toast("Ошибка удаления","err"); }
};
window.giftToggle=async id=>{
  const g=Gifts.list.find(x=>x.id===id); if(!g)return;
  g.is_active=!g.is_active;
  try{ await api("/admin/gifts/"+id,{method:"PUT",body:JSON.stringify({is_active:g.is_active})}); }catch(e){ if(e.message==="401")return; }
  renderGifts(); toast(g.is_active?"Подарок показан":"Подарок скрыт");
};
window.giftEdit=id=>{
  const g=id?Gifts.list.find(x=>x.id===id):{name_ru:"",name_uz:"",description_ru:"",description_uz:"",image_url:"",price_cashback:"",stock_quantity:"",is_active:true};
  const body=`<div class="form-grid">
    <div><label class="sub-label" style="margin-top:0">Название RU</label><input class="input" id="gNameRu" value="${esc(g.name_ru)}"></div>
    <div><label class="sub-label" style="margin-top:0">Название UZ</label><input class="input" id="gNameUz" value="${esc(g.name_uz)}"></div>
    <div class="full"><label class="sub-label" style="margin-top:0">Описание RU</label><textarea class="input" id="gDescRu">${esc(g.description_ru||"")}</textarea></div>
    <div class="full"><label class="sub-label" style="margin-top:0">Описание UZ</label><textarea class="input" id="gDescUz">${esc(g.description_uz||"")}</textarea></div>
    <div class="full"><label class="sub-label" style="margin-top:0">Картинка</label>${imgUploadWidget('gImg', g.image_url||"")}</div>
    <div><label class="sub-label" style="margin-top:0">Цена в кешбэке (сум)</label><input class="input mono" id="gPrice" type="number" value="${g.price_cashback||""}"></div>
    <div><label class="sub-label" style="margin-top:0">Кол-во (пусто = ∞)</label><input class="input mono" id="gStock" type="number" value="${g.stock_quantity==null?'':g.stock_quantity}"></div>
    <div class="full check-row"><label class="switch"><input type="checkbox" id="gActive" ${g.is_active?'checked':''}><span class="slider"></span></label><label for="gActive">Активен</label></div>
  </div>`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-primary" id="gSave">${id?'Сохранить':'Добавить'}</button>`;
  openModal(modalShell(id?"Редактировать подарок":"Новый подарок",body,foot));
  $("#gSave").onclick=async()=>{
    const payload={name_ru:$("#gNameRu").value,name_uz:$("#gNameUz").value,description_ru:$("#gDescRu").value,description_uz:$("#gDescUz").value,
      image_url:$("#gImg").value,price_cashback:+$("#gPrice").value,stock_quantity:$("#gStock").value===""?null:+$("#gStock").value,is_active:$("#gActive").checked};
    if(!payload.name_ru){toast("Введите название","err");return;}
    try{
      if(id){await api("/admin/gifts/"+id,{method:"PUT",body:JSON.stringify(payload)}); Object.assign(g,payload);}
      else{const r=await api("/admin/gifts",{method:"POST",body:JSON.stringify(payload)}); Gifts.list.push(Object.assign({id:r.id||Date.now()},payload));}
    }catch(e){ if(e.message==="401")return;
      if(id)Object.assign(g,payload); else Gifts.list.push(Object.assign({id:Date.now()},payload));
    }
    closeModal(); renderGifts(); toast(id?"Подарок обновлён":"Подарок добавлен");
  };
};

const Claims={list:[],tab:"pending",page:1};
async function pageClaims(){
  const c=$("#content");
  c.innerHTML=`<div id="clTabs"></div>
    <div class="table-wrap"><table><thead><tr><th>Клиент</th><th>Подарок</th><th>Цена</th><th>Дата</th><th>Статус</th><th></th></tr></thead>

function renderClaims(){
  const counts={pending:0,approved:0,shipping:0,confirmed:0,delivered:0,rejected:0};
  Claims.list.forEach(x=>{
    if(x.status==="issued") counts.delivered++;
    else if(counts[x.status]!==undefined) counts[x.status]++;
  });
  $("#clTabs").innerHTML=`<div class="tabs">
    ${[["pending","В обработке"],["approved","Одобрено"],["shipping","У доставки"],["confirmed","Ожидает клиента"],["delivered","Завершённые"],["rejected","Отклонённые"]].map(([k,l])=>
      `<div class="tab ${Claims.tab===k?'active':''}" onclick="clTab('${k}')">${l} ${counts[k]&&k!=='rejected'?`<span class="cnt">${counts[k]}</span>`:""}</div>`).join("")}
  </div>`;
  const arr=Claims.list.filter(x=>Claims.tab==='delivered'?(x.status==='delivered'||x.status==='issued'):x.status===Claims.tab);
  const p=paginate(arr,Claims.page,20);
  const body=$("#clBody"); if(!body)return;
  if(!p.items.length){body.innerHTML=emptyRow(6,"Нет заявок");$("#clPager").innerHTML="";return;}
  body.innerHTML=p.items.map(x=>{
    let act="";
    const trash=`<button class="btn btn-ghost btn-sm btn-icon" style="color:var(--danger)" title="Отклонить" onclick="clReject(${x.id})">${I.trash}</button>`;
    if(x.status==="pending")act=`<button class="btn btn-success btn-sm" onclick="clSet(${x.id},'approved')">${I.check}<span style="margin-left:4px">Одобрить</span></button>${trash}`;
    else if(x.status==="approved")act=`<button class="btn btn-primary btn-sm" onclick="clSet(${x.id},'shipping')">🚚<span style="margin-left:4px">Передать доставке</span></button>${trash}`;
    else if(x.status==="shipping")act=`<button class="btn btn-primary btn-sm" onclick="clSet(${x.id},'confirmed')">📦<span style="margin-left:4px">Запросить подтверждение</span></button>${trash}`;
    else if(x.status==="confirmed")act=`<button class="btn btn-ghost btn-sm" disabled style="opacity:.6;cursor:default">ожидает клиента…</button>`;
    const stMap={approved:'approved',shipping:'shipping',confirmed:'confirming',delivered:'confirmed',issued:'confirmed',rejected:'rejected'};
    const st=stMap[x.status]||'pending';
    return `<tr class="clickable" data-id="${x.id}" onclick="clOpen(${x.id})">
      <td><div class="cell-user"><div class="avatar">${initials(x.user_name)}</div><div class="meta"><b>${esc(x.user_name)}</b></div></div></td>
      <td>${esc(x.gift_name)}</td>
      <td class="t-strong mono">${fmtSum(x.price)}</td>
      <td class="muted nowrap">${fmtDate(x.created_at)}</td>
      <td><span class="badge-status st-${st}">${statusRu(x.status)}</span></td>
      <td class="t-actions" onclick="event.stopPropagation()">${I.eye?`<button class="btn btn-ghost btn-sm btn-icon" title="Открыть" onclick="clOpen(${x.id})">${I.eye}</button>`:""} ${act}</td></tr>`;
  }).join("");
  $("#clPager").innerHTML=pagerHTML(p,"clGo");
}
window.clOpen=id=>{
  const x=Claims.list.find(c=>c.id===id);if(!x)return;
  const stMap={approved:'approved',shipping:'shipping',confirmed:'confirming',delivered:'confirmed',issued:'confirmed',rejected:'rejected'};
  const st=stMap[x.status]||'pending';
  let act="";
  if(x.status==="pending")act=`<button class="btn btn-success" onclick="clSet(${x.id},'approved').then(()=>closeModal())">Одобрить</button><button class="btn btn-ghost" style="color:var(--danger)" onclick="closeModal();clReject(${x.id})">Отклонить</button>`;
  else if(x.status==="approved")act=`<button class="btn btn-primary" onclick="clSet(${x.id},'shipping').then(()=>closeModal())">Передать доставке 🚚</button>`;
  else if(x.status==="shipping")act=`<button class="btn btn-primary" onclick="clSet(${x.id},'confirmed').then(()=>closeModal())">Запросить подтверждение 📦</button>`;

    </div>
    ${x.reason?`<div class="info-banner" style="background:#fff3f3;color:var(--danger)">Причина отклонения: ${esc(x.reason)}</div>`:""}`;
  const foot=`<button class="btn btn-ghost x">Закрыть</button>${act}`;
  openModal(modalShell("Заявка на подарок",body,foot));
};
window.clTab=t=>{Claims.tab=t;Claims.page=1;renderClaims();};
window.clGo=p=>{Claims.page=p;renderClaims();};
window.clSet=async(id,status)=>{
  const x=Claims.list.find(c=>c.id===id);if(!x)return;
  const labels={approved:'одобрить заявку',shipping:'передать подарок в доставку',confirmed:'запросить подтверждение у клиента',delivered:'отметить как доставленный'};
  const label=labels[status]||'изменить статус';
  const giftName=esc(x.gift_name||x.name_ru||'');
  const ok=await new Promise(resolve=>{
    const foot=`<button class="btn btn-ghost" id="_cfNo">Отмена</button><button class="btn btn-primary" id="_cfYes">Подтвердить</button>`;
    const body=`<p style="color:var(--muted);margin-bottom:8px">Вы уверены, что хотите <b>${label}</b>?</p><p style="font-size:13px;color:var(--text)">${giftName}</p>`;
    openModal(modalShell('Подтверждение',body,foot));
    $('#_cfYes').onclick=()=>{closeModal();resolve(true);};
    $('#_cfNo').onclick=()=>{closeModal();resolve(false);};
    // кнопка × тоже должна отменять
    const xBtn=$('.modal .x');if(xBtn){const orig=xBtn.onclick;xBtn.onclick=()=>{if(orig)orig();resolve(false);};}
  });
  if(!ok)return;
  try{
    await api("/admin/claims/"+id,{method:"PUT",body:JSON.stringify({status})});
  }catch(e){
    if(e.message==="401")return;
    toast(e.message||'Ошибка обновления статуса','err');
    return;
  }
  x.status=status;
  const row=$(`#clBody tr[data-id="${id}"]`);
  if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingClaims=Claims.list.filter(c=>c.status==="pending").length;renderNav();renderClaims();},450);}
  else{Badges.pendingClaims=Claims.list.filter(c=>c.status==="pending").length;renderNav();renderClaims();}
  const msgs={approved:"Заявка одобрена",shipping:"Передано службе доставки",confirmed:"Запрос подтверждения отправлен клиенту"};
  toast(msgs[status]||"Статус обновлён");
};
window.clReject=id=>{
  const body=`<p style="margin-bottom:14px;color:var(--muted)">Причина отклонения заявки:</p><textarea class="input" id="clReason" placeholder="Причина..."></textarea>`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-danger" id="clRejDo">Отклонить</button>`;
  openModal(modalShell("Отклонить заявку",body,foot));
  $("#clRejDo").onclick=async()=>{
    const reason=$("#clReason").value.trim(); if(!reason){toast("Введите причину","err");return;}
    const x=Claims.list.find(c=>c.id===id);
    try{ await api("/admin/claims/"+id,{method:"PUT",body:JSON.stringify({status:"rejected",reason})}); }catch(e){ if(e.message==="401")return; }
    if(x){x.status="rejected";x.reason=reason;}
    closeModal();
    const row=$(`#clBody tr[data-id="${id}"]`);
    if(row){row.classList.add("removing");setTimeout(()=>{Badges.pendingClaims=Claims.list.filter(c=>c.status==="pending").length;renderNav();renderClaims();},450);}
    else{Badges.pendingClaims=Claims.list.filter(c=>c.status==="pending").length;renderNav();renderClaims();}
    toast("Заявка отклонена · клиенту отправлено уведомление","warn");
  };
};

const Agents={list:[]};
let _agAdminPeriod='month',_agAdminFrom='',_agAdminTo='';
function _agAdminDates(){
  const now=new Date(),pad=n=>String(n).padStart(2,'0'),fmt0=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(_agAdminPeriod==='7d'){const f=new Date(now);f.setDate(f.getDate()-6);return{df:fmt0(f),dt:fmt0(now)};}
  if(_agAdminPeriod==='30d'){const f=new Date(now);f.setDate(f.getDate()-29);return{df:fmt0(f),dt:fmt0(now)};}
  if(_agAdminPeriod==='month'){const f=new Date(now.getFullYear(),now.getMonth(),1);return{df:fmt0(f),dt:fmt0(now)};}
  if(_agAdminPeriod==='custom') return{df:_agAdminFrom,dt:_agAdminTo};
  return{df:'',dt:''};
}
function _agAdminFilterBar(){
  const{df,dt}=_agAdminDates();
  const chips=[{key:'7d',label:'7 дней'},{key:'30d',label:'30 дней'},{key:'month',label:'Этот месяц'},{key:'all',label:'Всё время'}];
  return `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
    <div style="display:flex;gap:6px;flex-wrap:wrap">${chips.map(c=>`<button class="btn btn-sm${_agAdminPeriod===c.key?' btn-primary':' btn-ghost'}" onclick="_setAgAdminPeriod('${c.key}')">${c.label}</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:8px">
      <span style="font-size:13px;color:var(--muted)">с</span>
      <input class="input" id="agAdmFrom" type="date" style="padding:5px 9px;font-size:13px;width:138px" value="${_agAdminPeriod==='custom'?_agAdminFrom:df}">
      <span style="font-size:13px;color:var(--muted)">по</span>
      <input class="input" id="agAdmTo" type="date" style="padding:5px 9px;font-size:13px;width:138px" value="${_agAdminPeriod==='custom'?_agAdminTo:dt}">
      <button class="btn btn-primary btn-sm" onclick="_applyAgAdminFilter()">Применить</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-primary btn-sm" onclick="agentEdit()">${I.plus}<span>Добавить агента</span></button>
  </div>`;
}
function _setAgAdminPeriod(p){_agAdminPeriod=p;_agAdminFrom='';_agAdminTo='';loadAgents();}
function _applyAgAdminFilter(){
  const f=document.getElementById('agAdmFrom'),t=document.getElementById('agAdmTo');
  if(f)_agAdminFrom=f.value;if(t)_agAdminTo=t.value;
  _agAdminPeriod='custom';loadAgents();
}
async function pageAgents(){
  const c=$("#content");
  c.innerHTML=`${_agAdminFilterBar()}<div class="table-wrap"><table><thead><tr><th>Имя</th><th>Телефон</th><th>Районы</th><th>Транзакций</th><th>Сумма продаж</th><th></th></tr></thead>
    <tbody id="agBody">${loadingTable(6)}</tbody></table></div>`;
  await loadAgents();
}
async function loadAgents(){
  const{df,dt}=_agAdminDates();
  const p=new URLSearchParams();
  if(df)p.set('date_from',df);if(dt)p.set('date_to',dt);
  const qs=p.toString();

// Хелперы rich-text редактора
// Сохраняем выделение перед кликом по кнопке тулбара
let _bcActiveEditor = null;
function _bcApply(edId, cmd){
  const ed = document.getElementById(edId);
  if(!ed) return;
  if(cmd === 'createLink'){
    // Сохраняем выделение ДО открытия prompt (иначе теряется)
    ed.focus();
    const sel = window.getSelection();
    let savedRange = null;
    if(sel && sel.rangeCount) savedRange = sel.getRangeAt(0).cloneRange();
    const url = prompt('Введите URL ссылки:','https://');
    if(!url || url.trim() === 'https://' || url.trim() === 'http://') return;
    // Восстанавливаем выделение после prompt
    if(savedRange){ sel.removeAllRanges(); sel.addRange(savedRange); }
    else { ed.focus(); }
    document.execCommand('createLink', false, url.trim());
    ed.querySelectorAll('a').forEach(a=>{ a.target='_blank'; a.rel='noopener'; });
  } else {
    ed.focus();
    document.execCommand(cmd, false, null);
  }
}
function bcFmt(cmd){ _bcApply('bcEdRu', cmd); }
function bcFmtUz(cmd){ _bcApply('bcEdUz', cmd); }

// Конвертация contenteditable HTML → Telegram HTML (tree-walk, без потери тегов)
function htmlToTgHtml(el){
  if(!el) return '';
  function walk(node){
    if(node.nodeType === 3){
      // &nbsp; (U+00A0) → обычный пробел; Telegram не поддерживает &nbsp;
      return node.textContent.replace(/ /g,' ');
    }
    if(node.nodeType !== 1) return '';
    const tag = node.tagName.toLowerCase();
    const inner = Array.from(node.childNodes).map(walk).join('');
    if(tag === 'br') return '\n';
    if(tag === 'p' || tag === 'div') return inner + '\n';
    if(tag === 'b' || tag === 'strong') return '<b>' + inner + '</b>';
    if(tag === 'i' || tag === 'em') return '<i>' + inner + '</i>';
    if(tag === 'u') return '<u>' + inner + '</u>';
    if(tag === 's' || tag === 'strike' || tag === 'del') return '<s>' + inner + '</s>';
    if(tag === 'a'){
      const href = (node.getAttribute('href')||'').replace(/&(?!amp;)/g,'&amp;').replace(/"/g,'&quot;');
      return '<a href="' + href + '">' + inner + '</a>';
    }
    return inner;
  }
  const result = Array.from(el.childNodes).map(walk).join('');
  return result.trim().replace(/\n{3,}/g,'\n\n');
}

function _castStatusBadge(b){
  const st=b.status||"";
  if(st==="sending") return `<span class="tag st-shipping" style="animation:pulse 1s infinite">⏳ Отправляется…</span>`;
  if(st==="pending"&&!b.scheduled_at) return `<span class="tag st-shipping">⏳ В очереди</span>`;
  if(b.scheduled_at&&!b.is_sent) return `<span class="tag st-shipping">⏰ ${fmtDateTime(b.scheduled_at)}</span>`;
  if(st==="completed_with_errors") return `<span class="tag st-confirmed" style="background:#fef3c7;color:#92400e">⚠ Отправлено с ошибками</span>`;
  if(st==="failed") return `<span class="tag" style="background:#fee2e2;color:#991b1b">✗ Ошибка</span>`;
  return `<span class="tag st-confirmed">✓ Отправлено</span>`;
}
let _castRefreshTimer=null;

  const body=$("#castHistBody"); if(!body) return;
  if(!Cast.history.length){body.innerHTML=emptyRow(5,"Рассылок пока не было");return;}
  const hasActive=Cast.history.some(b=>b.status==="sending"||b.status==="pending"&&!b.scheduled_at);
  if(hasActive&&!_castRefreshTimer){
    _castRefreshTimer=setTimeout(async()=>{
      _castRefreshTimer=null;
      try{Cast.history=await api("/admin/broadcasts");renderCastHistory();}catch(e){}
    },4000);
  } else if(!hasActive&&_castRefreshTimer){
    clearTimeout(_castRefreshTimer);_castRefreshTimer=null;
  }
  body.innerHTML=Cast.history.map(b=>{
    const audMap={all:"👥 Все",region:`📍 ${esc(b.region_name||"Регион")}`,language:`🌐 ${b.lang_filter==="ru"?"Русский":"O'zbek"}`};
    const aud=audMap[b.target]||"👥 Все";
    const langBadge=b.lang_filter?`<span class="tag" style="margin-left:4px">${b.lang_filter==="ru"?"🇷🇺":"🇺🇿"}</span>`:"";
    const titleStr=b.title?`<div style="font-weight:600;font-size:12px;color:var(--primary);margin-bottom:2px">${esc(b.title)}</div>`:"";
    const stickerBadge=b.sticker_file_id?`<span class="tag" style="margin-right:4px">🎭</span>`:"";
    const imgBadge=b.image_url?`<span class="tag" style="margin-right:4px">🖼</span>`:"";
    const preview=esc((b.message_ru||"").replace(/<[^>]+>/g,"").slice(0,60))+(((b.message_ru||"").length>60)?"…":"");
    const sent=b.sent_count||0;
    const total=b.total_users||0;
    const failed=b.failed_count||0;
    const isActive=b.status==="sending"||(b.status==="pending"&&!b.scheduled_at);
    const countCell=isActive
      ? `<span class="muted">${total?total+' получателей':'—'}</span>`
      : `<b class="t-strong">${fmt(sent)}</b><span class="muted"> / ${total||sent} чел.</span>${failed?`<span style="color:var(--danger);font-size:11px"> (${failed} ошибок)</span>`:""}`;
    return `<tr>
      <td class="mono nowrap">${fmtDateTime(b.created_at)}</td>
      <td>${aud}${langBadge}</td>
      <td style="max-width:240px;color:var(--text)">${titleStr}${stickerBadge}${imgBadge}${preview}</td>
      <td>${_castStatusBadge(b)}</td>
      <td style="text-align:right">${countCell}</td>
    </tr>`;
  }).join("");
}

window.castSend=(scheduleMode)=>{
  const edRu=document.getElementById('bcEdRu'), edUz=document.getElementById('bcEdUz');
  const ru=htmlToTgHtml(edRu), uz=htmlToTgHtml(edUz);
  if(!ru&&!uz){toast("Введите текст рассылки","err");return;}
  const aud=$("#bcAud").value;
  const regionId=aud==="region"?(+$("#bcRegion").value||null):null;
  const langFilter=$("#bcLang").value||null;
  const regionName=aud==="region"?(REGIONS_DATA.find(r=>r.id===regionId)||{}).name_ru||"":null;
  const scheduleCheck=document.getElementById('bcScheduleCheck');
  const scheduleAt=document.getElementById('bcScheduleAt');
  const useSchedule = scheduleMode || (scheduleCheck&&scheduleCheck.checked);
  const scheduledAt = useSchedule&&scheduleAt&&scheduleAt.value ? new Date(scheduleAt.value).toISOString() : null;

  if(useSchedule&&!scheduledAt){toast("Укажите дату и время отправки","err");return;}

  const audLabel = aud==="all" ? "всем клиентам"
    : aud==="region" ? `клиентам региона «${regionName||regionId}»`
    : `клиентам (язык: ${langFilter==="ru"?"русский":"O'zbek"})`;

  const preview=`<div style="background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;white-space:pre-wrap;max-height:160px;overflow:auto">${ru.replace(/\n/g,'<br>')}</div>`;
  const schedInfo = scheduledAt ? `<div class="info-banner" style="margin-top:10px">⏰ Будет отправлено: <b>${fmtDateTime(scheduledAt)}</b></div>` : '';
  const body=`<p style="font-size:15px">Отправить рассылку <b>${audLabel}</b>?</p>
    ${preview}${schedInfo}
    <div class="info-banner" style="margin-top:14px">${I.bell}<span>${scheduledAt?"Рассылка будет запланирована и отправлена автоматически.":"Сообщение получат все подходящие клиенты в Telegram. Действие необратимо."}</span></div>`;
  const btnLabel = scheduledAt ? "⏰ Запланировать" : `${I.cast} Отправить`;
  const foot=`<button class="btn btn-ghost x">Отмена</button><button class="btn btn-primary" id="castDo">${btnLabel}</button>`;
  openModal(modalShell("Подтверждение рассылки",body,foot));
  $("#castDo").onclick=async()=>{
    const btn=$("#castDo");
    btn.disabled=true; btn.textContent=scheduledAt?"Планируем…":"Отправляем…";
    const bcTitle=(document.getElementById('bcTitle')?.value||"").trim();
    const bcSticker=(document.getElementById('bcSticker')?.value||"").trim();
    const bcPayload={title:bcTitle,target:aud,message_ru:ru,message_uz:uz||ru,parse_mode:"HTML",image_url:_bcImageUrl||"",sticker_file_id:bcSticker};
    if(regionId) bcPayload.region_id=regionId;
    if(langFilter) bcPayload.lang_filter=langFilter;
    if(scheduledAt) bcPayload.scheduled_at=scheduledAt;
    try{
      const r=await api("/admin/broadcast",{method:"POST",body:JSON.stringify(bcPayload)});
      closeModal();
      if(scheduledAt){
        toast(`Рассылка запланирована на ${fmtDateTime(scheduledAt)}`,"ok");
      } else {
        toast(`Рассылка запущена — ${fmt(r.total_users||0)} получателей. История обновляется автоматически.`,"ok");
      }
      if(edRu) edRu.innerHTML="";
      if(edUz) edUz.innerHTML="";
      if(document.getElementById('bcImgPreview')) document.getElementById('bcImgPreview').innerHTML="";
      if(document.getElementById('bcTitle')) document.getElementById('bcTitle').value="";
      if(document.getElementById('bcSticker')) document.getElementById('bcSticker').value="";
      _bcImageUrl="";
      try{ Cast.history=await api("/admin/broadcasts"); renderCastHistory(); }catch(e){}
    }catch(e){
      if(e.message==="401")return;
      closeModal();
      toast("Ошибка при отправке рассылки","err");
    }
  };
};

window.doBackup=async()=>{
  const btn=$("#bkBtn");
  btn.disabled=true; btn.style.opacity=".7";
  btn.innerHTML=`<div class="spin" style="width:16px;height:16px;border-width:2px;margin-right:6px"></div><span>Создание и скачивание...</span>`;
  try{
    const BASE=window.API_BASE||"";
    const resp=await fetch(BASE+"/admin/backup",{
      method:"POST",
      headers:{"Authorization":"Bearer "+State.token,"Content-Type":"application/json"}
    });
    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      throw new Error(err.detail||"Ошибка сервера "+resp.status);
    }
    const blob=await resp.blob();
    const cd=resp.headers.get("Content-Disposition")||"";
    const match=cd.match(/filename="?([^"]+)"?/);
    const name=match?match[1]:"scenti_backup.sql";
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.click();
    URL.revokeObjectURL(url);
    toast("Бэкап скачан","ok",name);
    setTimeout(pageBackup, 500);
  }catch(e){
    toast("Ошибка бэкапа","err",e.message);
  }finally{
    const b=$("#bkBtn");
    if(b){b.disabled=false;b.style.opacity="";b.innerHTML=`${I.backup}<span>Создать бэкап БД</span>`;}
  }
};
