<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Scenti — Кешбэк-кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============ TOKENS ============ */
:root{
  --primary:#0E37A3;
  --light-blue:#2E7BD6;
  --bg:#EDF1F7;
  --card:#ffffff;
  --text:#16233F;
  --muted:#7C8BA5;
  --border:rgba(14,55,163,.07);
  --hero-grad:linear-gradient(160deg,#2E7BD6 0%,#0E37A3 70%,#0A2A7D 100%);
  --tile-grad:linear-gradient(150deg,#EAF2FE 0%,#CFE0FB 100%);
  --green:#16A34A;
  --green-bg:#DCFCE7;
  --red:#DC2626;
  --red-bg:#FEE2E2;
  --amber:#B45309;
  --amber-bg:#FEF3C7;
  --shadow-sm:0 4px 16px rgba(14,55,163,.06);
  --shadow-md:0 12px 32px rgba(14,55,163,.10);
  --shadow-tab:0 8px 30px rgba(14,55,163,.16);
  --r-card:20px;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-serif:'Cormorant Garamond',serif;
  --font-logo:'Fredoka',sans-serif;
}

/* ============ RESET ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
img{display:block;max-width:100%;}
::-webkit-scrollbar{display:none;}

/* ============ APP SHELL ============ */
#app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:520px;
  margin:0 auto;
  position:relative;
  background:var(--bg);
}
.screen{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:18px 16px 110px;
  display:none;
  animation:fadeUp .38s cubic-bezier(.22,.61,.36,1);
}
.screen.active{display:block;}

/* ============ ANIMATIONS ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scPop{0%{transform:scale(0);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes scDraw{from{stroke-dashoffset:40;}to{stroke-dashoffset:0;}}
@keyframes scRing{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(1.9);opacity:0;}}
@keyframes scGlow{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.35);}50%{box-shadow:0 0 0 16px rgba(22,163,74,0);}}
@keyframes scBurst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--bx),var(--by)) scale(.2);opacity:0;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ TYPOGRAPHY ============ */
.page-title{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:500;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px;}
.section-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.see-all{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--primary);}
.see-all svg{width:13px;height:13px;}
.label-cap{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 4px 10px;}

/* ============ HERO ============ */
.hero{
  background:var(--hero-grad);
  border-radius:30px;
  padding:20px 20px 22px;
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(14,55,163,.28);
}
.hero-wave{position:absolute;inset:0;background:url(assets/wave-hero.png) center/cover no-repeat;opacity:.2;border-radius:inherit;z-index:0;pointer-events:none;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(177deg,rgba(11,40,110,.28) 0%,rgba(11,38,120,.38) 45%,rgba(9,30,98,.72) 100%);border-radius:inherit;z-index:0;pointer-events:none;}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.logo{font-family:var(--font-logo);font-weight:600;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:7px;}
.logo-mark{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
.id-pill{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:600;letter-spacing:.3px;}
.hero-user{display:flex;align-items:center;gap:12px;margin-top:18px;position:relative;z-index:1;}
.avatar{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;border:1.5px solid rgba(255,255,255,.3);}
.hero-user .name{font-size:16px;font-weight:700;}
.hero-user .biz{font-size:12.5px;opacity:.78;font-weight:500;margin-top:1px;}
.wallet-cap{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.7;margin-top:22px;position:relative;z-index:1;}
.balance{display:flex;align-items:baseline;gap:8px;margin-top:5px;position:relative;z-index:1;}
.balance .num{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.balance .cur{font-size:16px;font-weight:600;opacity:.8;}
.hero-btn{
  width:100%;margin-top:20px;background:#fff;color:var(--primary);
  border-radius:16px;padding:14px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;position:relative;z-index:1;
  transition:transform .15s,box-shadow .2s;
}
.hero-btn:active{transform:scale(.97);}
.hero-btn svg{width:19px;height:19px;}
.hero-info{
  display:flex;align-items:center;gap:9px;margin-top:14px;
  background:rgba(255,255,255,.12);border-radius:14px;padding:11px 13px;
  font-size:12px;font-weight:500;line-height:1.4;position:relative;z-index:1;
}
.hero-info svg{width:16px;height:16px;flex-shrink:0;opacity:.9;}

/* ============ H SCROLL ============ */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;}
.gift-card{
  flex-shrink:0;width:136px;background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .15s;border:1px solid var(--border);
}
.gift-card:active{transform:scale(.97);}
.gift-card .pic{height:96px;background:var(--tile-grad);display:flex;align-items:center;justify-content:center;}
.gift-card .pic svg{width:46px;height:46px;color:var(--light-blue);opacity:.85;}
.gift-card .body{padding:11px 12px 13px;}
.gift-card .gname{font-size:13px;font-weight:700;line-height:1.25;}
.gift-card .gprice{display:inline-block;font-size:12px;font-weight:700;color:var(--primary);margin-top:6px;background:rgba(14,55,163,.07);padding:4px 9px;border-radius:9px;}

.cat-card{
  flex-shrink:0;width:140px;background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .15s;border:1px solid var(--border);
}
.cat-card:active{transform:scale(.97);}
.cat-card .pic{height:104px;background:var(--tile-grad);display:flex;align-items:center;justify-content:center;}
.cat-card .pic svg{width:42px;height:42px;color:var(--light-blue);opacity:.85;}
.cat-card .body{padding:11px 12px 13px;}
.cat-card .cname{font-size:13px;font-weight:700;line-height:1.25;}
.cat-card .tag{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:600;color:var(--light-blue);background:#EAF2FE;border-radius:8px;padding:3px 8px;}

/* ============ CARD GENERIC ============ */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.contact-card{padding:16px;display:flex;align-items:center;gap:13px;margin-top:6px;}
.contact-card .ic{width:44px;height:44px;border-radius:14px;background:#EAF2FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-card .ic svg{width:22px;height:22px;color:var(--primary);}
.contact-card .ct{flex:1;}
.contact-card .ct .t{font-size:14px;font-weight:700;}
.contact-card .ct .s{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500;}
.contact-card .go{width:30px;height:30px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-card .go svg{width:14px;height:14px;color:#fff;}

/* ============ COMPACT BALANCE ============ */
.bal-compact{
  background:var(--hero-grad);border-radius:22px;padding:18px 20px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow-md);margin-top:16px;
}
.bal-compact::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;right:-40px;}
.bal-compact .cap{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.75;position:relative;z-index:1;}
.bal-compact .b{font-size:32px;font-weight:800;margin-top:5px;letter-spacing:-.02em;position:relative;z-index:1;}
.bal-compact .b span{font-size:14px;font-weight:600;opacity:.8;margin-left:5px;}

/* ============ STATS CARD (history) ============ */
.stats-card{
  background:var(--hero-grad);border-radius:22px;padding:18px 20px;color:#fff;
  display:flex;gap:14px;margin-top:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);
}
.stats-card::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);top:-80px;right:-50px;}
.stat-col{flex:1;position:relative;z-index:1;}
.stat-col .cap{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.72;text-transform:uppercase;line-height:1.3;}
.stat-col .v{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.01em;}
.stat-col .v span{font-size:12px;font-weight:600;opacity:.8;margin-left:3px;}
.stat-divider{width:1px;background:rgba(255,255,255,.18);}

/* ============ GIFTS GRID ============ */
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;gap:16px;}
.empty-state .es-icon svg{width:72px;height:72px;color:#CBD5E1;opacity:.8;}
.empty-state p{font-size:14px;color:#94A3B8;font-weight:500;line-height:1.5;}
.gift-grid-card{
  background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-sm);
  overflow:hidden;transition:transform .15s;border:1px solid var(--border);position:relative;
}
.gift-grid-card:active{transform:scale(.97);}
.gift-grid-card .pic{aspect-ratio:1/1;background:var(--tile-grad);display:flex;align-items:center;justify-content:center;position:relative;}
.gift-grid-card .pic svg{width:56px;height:56px;color:var(--light-blue);opacity:.85;}
.gift-grid-card .body{padding:12px 13px 14px;}
.gift-grid-card .gname{font-size:14px;font-weight:700;line-height:1.25;}
.gift-grid-card .gprice{display:inline-block;font-size:13px;font-weight:700;color:var(--primary);margin-top:6px;background:rgba(14,55,163,.07);padding:5px 10px;border-radius:10px;}
.badge-short{
  position:absolute;top:10px;right:10px;background:var(--amber-bg);color:var(--amber);
  font-size:10px;font-weight:700;padding:4px 8px;border-radius:10px;z-index:2;
}

/* ============ TRANSACTIONS ============ */
.date-group{margin-top:20px;}
.date-label{font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 10px;}
.txn{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:10px;}
.txn .tic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.txn .tic.in{background:var(--green-bg);color:var(--green);}
.txn .tic.out{background:var(--red-bg);color:var(--red);}
.txn .tic svg{width:20px;height:20px;}
.txn .tinfo{flex:1;min-width:0;}
.txn .tinfo .tt{font-size:14px;font-weight:700;}
.txn .tinfo .ts{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;}
.txn .tright{text-align:right;flex-shrink:0;}
.txn .amt{font-size:14px;font-weight:800;}
.txn .amt.pos{color:var(--green);}
.txn .amt.neg{color:var(--red);}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:9px;margin-top:5px;}
.pill.wait{background:var(--amber-bg);color:var(--amber);}
.pill.done{background:var(--green-bg);color:var(--green);}
.pill.rej{background:var(--red-bg);color:var(--red);}
.pill.spent{background:var(--red-bg);color:var(--red);}
.pill.refund{background:#FFF0D4;color:#C47A00;}

/* ============ CATALOG ROWS ============ */
.cat-row{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:10px;transition:transform .15s;}
.cat-row:active{transform:scale(.98);}
.cat-row .ic{width:46px;height:46px;border-radius:14px;background:var(--tile-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-row .ic svg{width:24px;height:24px;color:var(--light-blue);}
.cat-row .info{flex:1;min-width:0;}
.cat-row .info .t{font-size:14px;font-weight:700;}
.cat-row .info .tag{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:600;color:var(--light-blue);background:#EAF2FE;border-radius:8px;padding:3px 8px;}
.cat-row .chev{color:var(--muted);flex-shrink:0;}
.cat-row .chev svg{width:16px;height:16px;}

/* ============ PROFILE ============ */
.prof-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px;}
.prof-avatar{width:66px;height:66px;border-radius:22px;background:var(--hero-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;box-shadow:0 10px 24px rgba(14,55,163,.3);}
.prof-head .pname{font-size:19px;font-weight:800;margin-top:12px;letter-spacing:-.01em;}
.prof-head .pbiz{font-size:13px;color:var(--muted);margin-top:2px;font-weight:500;}
.prof-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px;}
.pstat{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.pstat .v{font-size:18px;font-weight:800;color:var(--primary);letter-spacing:-.01em;}
.pstat .l{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:4px;}
.block{background:var(--card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-top:14px;}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
.block-head .bt{font-size:14px;font-weight:700;}
.req-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);}
.req-item:last-child{border-bottom:none;padding-bottom:0;}
.req-item:first-of-type{padding-top:0;}
.req-item .ic{width:36px;height:36px;border-radius:11px;background:var(--tile-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.req-item .ic svg{width:18px;height:18px;color:var(--light-blue);}
.req-item .ri{flex:1;}
.req-item .ri .t{font-size:13px;font-weight:700;}
.req-item .ri .s{font-size:11.5px;color:var(--muted);margin-top:2px;}
.info-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;padding-bottom:0;}
.info-row:first-child{padding-top:0;}
.info-row .ic{width:38px;height:38px;border-radius:12px;background:#EAF2FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.info-row .ic svg{width:19px;height:19px;color:var(--primary);}
.info-row .ii{flex:1;}
.info-row .ii .l{font-size:11px;color:var(--muted);font-weight:600;}
.info-row .ii .v{font-size:13.5px;font-weight:700;margin-top:1px;}
.lang-row{display:flex;gap:10px;margin-top:6px;}
.lang-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:14px;font-size:14px;font-weight:700;background:var(--bg);color:var(--muted);transition:all .2s;border:2px solid transparent;}
.lang-btn.active{background:#EAF2FE;color:var(--primary);border-color:var(--light-blue);}
.lang-btn .flag{font-size:18px;}
.link-row{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-top:11px;transition:transform .15s;}
.link-row:active{transform:scale(.98);}
.link-row .ic{width:40px;height:40px;border-radius:13px;background:#EAF2FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.link-row .ic svg{width:20px;height:20px;color:var(--primary);}
.link-row .lt{flex:1;font-size:14px;font-weight:700;}
.link-row .chev{color:var(--muted);}
.link-row .chev svg{width:16px;height:16px;}
.prof-logo{text-align:center;margin-top:26px;color:var(--muted);}
.prof-logo .l{font-family:var(--font-logo);font-weight:600;font-size:22px;color:var(--primary);opacity:.5;}
.prof-logo .v{font-size:11px;margin-top:3px;opacity:.7;}

/* ============ TABBAR ============ */
.tabbar{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  width:calc(100% - 28px);max-width:492px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:26px;box-shadow:var(--shadow-tab);
  display:flex;justify-content:space-around;align-items:center;
  padding:9px 8px;z-index:50;border:1px solid rgba(255,255,255,.6);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;padding:5px 0;position:relative;color:var(--muted);transition:color .2s;}
.tab svg{width:23px;height:23px;position:relative;z-index:1;transition:transform .2s;}
.tab .tlabel{font-size:9.5px;font-weight:600;position:relative;z-index:1;}
.tab .dot{position:absolute;top:-1px;width:38px;height:38px;border-radius:50%;background:#EAF2FE;opacity:0;transform:scale(.5);transition:all .25s;}
.tab.active{color:var(--primary);}
.tab.active .dot{opacity:1;transform:scale(1);}
.tab.active svg{transform:translateY(-1px);}

/* ============ SHEETS ============ */
.overlay{
  position:fixed;inset:0;background:rgba(11,28,60,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .25s;
}
.overlay.open{display:flex;}
.sheet{
  width:100%;max-width:520px;background:var(--card);border-radius:30px 30px 0 0;
  padding:14px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:slideUp .38s cubic-bezier(.22,.61,.36,1);position:relative;
}
.handle{width:42px;height:5px;border-radius:3px;background:#D5DEEC;margin:0 auto 16px;}
.sheet-ic{width:60px;height:60px;border-radius:20px;background:var(--hero-grad);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 10px 24px rgba(14,55,163,.28);}
.sheet-ic svg{width:30px;height:30px;color:#fff;}
.sheet-ic.big{width:128px;height:128px;border-radius:32px;background:var(--tile-grad);box-shadow:none;}
.sheet-ic.big svg{width:62px;height:62px;color:var(--light-blue);}
.sheet h3{font-family:var(--font-serif);font-size:27px;font-weight:600;text-align:center;letter-spacing:.01em;}
.sheet .sheet-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;font-weight:500;line-height:1.5;}
.amount-input{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:24px 0 6px;}
.amount-input input{
  font-size:42px;font-weight:800;text-align:center;border:none;outline:none;
  width:auto;max-width:240px;color:var(--text);background:transparent;letter-spacing:-.02em;
}
.amount-input input::placeholder{color:#C5D0E0;}
.amount-input .cur{font-size:18px;font-weight:700;color:var(--muted);}
.avail{text-align:center;font-size:13px;color:var(--muted);font-weight:600;}
.err-msg{text-align:center;font-size:13px;color:var(--red);font-weight:700;margin-top:8px;display:none;}
.err-msg.show{display:block;}
.chips{display:flex;gap:10px;margin:20px 0 4px;}
.chip{flex:1;padding:12px;border-radius:14px;background:var(--bg);font-size:14px;font-weight:700;color:var(--text);transition:all .18s;border:2px solid transparent;}
.chip:active{transform:scale(.96);}
.chip.active{background:#EAF2FE;color:var(--primary);border-color:var(--light-blue);}
.big-amount{font-size:42px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:18px 0;}
.big-amount span{font-size:18px;font-weight:700;color:var(--muted);margin-left:6px;}
.kv-table{margin:18px 0;}
.kv{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{font-size:14px;color:var(--muted);font-weight:600;}
.kv .v{font-size:15px;font-weight:800;}
.kv .v.red{color:var(--red);}
.kv .v.blue{color:var(--primary);}
.kv .v.green{color:var(--green);}
.btn{width:100%;padding:15px;border-radius:16px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s;}
.btn:active{transform:scale(.98);}
.btn svg{width:18px;height:18px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:disabled{opacity:.4;pointer-events:none;}
.btn-ghost{background:var(--bg);color:var(--text);margin-top:10px;}
.btn-row{margin-top:20px;}

/* ============ SUCCESS ============ */
.success-wrap{position:relative;display:flex;justify-content:center;margin:10px 0 20px;}
.sc-circle{width:96px;height:96px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;position:relative;animation:scPop .5s cubic-bezier(.22,.61,.36,1) both,scGlow 2s ease-in-out 0.5s infinite;}
.sc-circle svg{width:52px;height:52px;}
.sc-circle svg path{stroke:var(--green);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:scDraw .5s ease .35s forwards;}
.sc-ring{position:absolute;width:96px;height:96px;border-radius:50%;border:3px solid var(--green);animation:scRing 1s ease-out .3s both;}
.burst{position:absolute;width:9px;height:9px;border-radius:50%;top:48px;left:50%;animation:scBurst .8s ease-out .25s both;}

/* ============ FEATURE CHIPS / SPECS (sheet detail) ============ */
.spec-row{display:flex;gap:11px;margin:16px 0;}
.spec{flex:1;background:var(--bg);border-radius:14px;padding:13px;text-align:center;}
.spec .sl{font-size:11px;color:var(--muted);font-weight:600;}
.spec .sv{font-size:15px;font-weight:800;margin-top:4px;}
.feat-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
.feat-chip{font-size:12px;font-weight:600;color:var(--primary);background:#EAF2FE;border-radius:11px;padding:7px 12px;}
.sheet-text{font-size:14px;color:var(--text);line-height:1.65;font-weight:500;margin:10px 0;opacity:.85;}

/* ============ STEPS (requests) ============ */
.steps{display:flex;align-items:flex-start;margin:18px 0 8px;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
.step .sn{width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;z-index:1;}
.step.done .sn{background:var(--green-bg);color:var(--green);}
.step.active .sn{background:var(--primary);color:#fff;}
.step .stxt{font-size:11px;font-weight:600;margin-top:7px;color:var(--muted);line-height:1.3;}
.step.active .stxt,.step.done .stxt{color:var(--text);}
.step-line{position:absolute;top:18px;left:50%;width:100%;height:2px;background:var(--border);z-index:0;}
.step.done .step-line{background:var(--green);}
</style>

    icon:'spray',

    specs:Array.isArray(d.specs)?d.specs:(d.specs&&typeof d.specs==='object'?Object.entries(d.specs):[]),
    feats:d.features||[],
  }));
  const statusCls={pending:'wait',approved:'done',shipping:'done',confirmed:'done',client_confirmed:'done',delivered:'done',rejected:'rej'};
  REQUESTS=REQUESTS_RAW.map(r=>({
    id:r.id,
    name:l==='uz'?(r.name_uz||r.name_ru):r.name_ru,
    rawStatus:r.status,
    pill:statusCls[r.status]||'wait',

/* =================== API =================== */
let _tgInitData = '';
let _tgUserId = '';
try{
  const tg=window.Telegram&&Telegram.WebApp;
  _tgInitData=tg&&tg.initData||'';
  _tgUserId=String((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)||'');
}catch(e){}

async function apiFetch(path, opts={}){
  const headers={'Content-Type':'application/json'};
  if(_tgInitData) headers['X-Telegram-Data']=_tgInitData;
  else if(_tgUserId) headers['X-Telegram-Id']=_tgUserId;
  const r=await fetch(path,{...opts,headers:{...headers,...(opts.headers||{})}});
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();if(j.detail)msg=j.detail;}catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

function txnDate(iso){
  if(!iso)return '';
  const d=new Date(iso), now=new Date();
  if(d.toDateString()===now.toDateString()) return tx('today');
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long'});
}
function txnStatusInfo(status){
  const cls={pending:'wait',approved:'done',rejected:'rej',refund:'refund'};
  return {cls:cls[status]||'wait', text:tx('txn_'+status)||status};
}

function buildTxnsGroups(){
  const all=[];
  TXNS_RAW.forEach(t=>{
    const si=txnStatusInfo(t.status);
    const isRefund=t.status==='refund';
    all.push({
      _ts:new Date(t.created_at).getTime(),
      type: 'in',
      title: isRefund ? tx('txn_refund') : tx('purchase'),
      sum:fmt(t.amount)+' сум',
      amt: '+'+fmt(t.cashback_amount||0),
      status:si.cls,statusText:si.text,
      icon: isRefund ? 'wallet' : 'cart',
    });
  });
  SPENDS_RAW.forEach(s=>{
    const isGift=!!s.gift_request_id;
    const spendTitle=isGift?(USER.lang==='uz'?"Sovg'a xaridi":'Покупка подарка'):(USER.lang==='uz'?"Keshbek bilan to'lov":'Оплата кешбэком');
    all.push({_ts:new Date(s.created_at).getTime(),type:'out',title:spendTitle,sum:'',amt:'-'+fmt(s.amount),status:'spent',statusText:USER.lang==='uz'?"Sarflandi":'Списано',icon:isGift?'gift':'wallet'});
  });
  all.sort((a,b)=>b._ts-a._ts);
  const groups={};
  all.forEach(item=>{
    const label=txnDate(new Date(item._ts).toISOString());
    if(!groups[label])groups[label]=[];
    groups[label].push(item);
  });
  return Object.entries(groups).map(([date,items])=>({date,items}));
}

  setTimeout(()=>inp.focus(),300);

function setPct(p){

function spendSuccess(){
  haptic('heavy');
  try{Telegram.WebApp.HapticFeedback.notificationOccurred('success');}catch(e){}
  const colors=['#16A34A','#2E7BD6','#0E37A3','#F59E0B','#EC4899','#22C55E'];

  for(let i=0;i<10;i++){

    bursts+=`<span class="burst" style="--bx:${Math.cos(ang)*dist}px;--by:${Math.sin(ang)*dist}px;background:${colors[i%colors.length]};"></span>`;

  $('#sheet').innerHTML = `<div class="handle"></div>
    <div class="success-wrap">
      <div class="sc-ring"></div>
      <div class="sc-circle"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg></div>

      <div class="kv"><span class="k">${tx('remainder_lbl')}</span><span class="v ${enough?'green':'red'}">${enough?fmt(remain)+' сум':tx('not_enough')}</span></div>
    </div>
    <button class="btn btn-primary" ${enough?`onclick="giftRequest(${JSON.stringify(g.name)},${g.id})"`:' disabled'}>${enough?tx('order_gift'):tx('no_funds_btn')}</button>`);
}

/* =================== CATALOG DETAIL =================== */
function openCatDetail(type,i){
  const c = type==='device'?DEVICES[i]:AROMAS[i];
  const heroHtml = c.image_url
    ? `<div style="width:100%;height:220px;border-radius:20px;overflow:hidden;margin-bottom:14px;background:linear-gradient(145deg,#f0f5ff,#e8eef9);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;"><img src="${c.image_url}" style="max-width:100%;max-height:188px;object-fit:contain;display:block;filter:drop-shadow(0 8px 24px rgba(14,55,163,.15));" onerror="this.style.display='none'"></div>`
    : `<div class="sheet-ic big">${ICONS[c.icon]}</div>`;
  openSheet(`
    ${heroHtml}
    <h3>${c.name}</h3>
    <p class="sheet-sub">${c.tag}</p>
    <p class="sheet-text">${c.desc}</p>
    <div class="spec-row">
      ${c.specs.map(s=>`<div class="spec"><div class="sl">${s[0]}</div><div class="sv">${s[1]}</div></div>`).join('')}
    </div>
    <div class="feat-chips">${c.feats.map(f=>`<span class="feat-chip">${f}</span>`).join('')}</div>
    <div class="btn-row"><button class="btn btn-primary" onclick="openAgent()">${tx('order_btn')}</button></div>`);
}

/* =================== PRIVACY =================== */
async function openPrivacy(){
  openSheet(`
    <div class="sheet-ic">${ICONS.shield}</div>
    <h3>${tx('privacy_title')}</h3>
    <p class="sheet-text" id="privacyText">${tx('privacy_t1')}</p>
    <button class="btn btn-primary" style="margin-bottom:0;display:none" id="privacyDlBtn">${ICONS.download} ${tx('download_btn')}</button>
    <button class="btn btn-ghost" onclick="closeSheet()">${tx('ok_btn')}</button>`);
  try{
    const p=await apiFetch('/api/privacy');
    const txt=USER.lang==='uz'?(p.content_uz||p.content_ru):p.content_ru;
    const el=document.getElementById('privacyText');
    if(el&&txt) el.textContent=txt;
    if(p.file_url){
      const btn=document.getElementById('privacyDlBtn');
      if(btn){
        btn.style.display='';
        btn.onclick=()=>{
          try{
            const tg=window.Telegram&&window.Telegram.WebApp;
            if(tg&&tg.openLink) tg.openLink(p.file_url);
            else window.open(p.file_url,'_blank');
          }catch(e){}
        };
      }
    }
  }catch(e){}
}

/* =================== AGENT =================== */
function openAgent(){
  openSheet(`
    <div class="sheet-ic">${ICONS.send}</div>
    <h3>${tx('agent_title')}</h3>
    <p class="sheet-sub">${tx('agent_sub')}</p>
    <a class="link-row" href="tel:${CONTACT.phone}" style="margin-top:18px;cursor:pointer;text-decoration:none;color:inherit" onclick="(function(e){try{var tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.openLink){e.preventDefault();tg.openLink('tel:${CONTACT.phone}');}else{e.preventDefault();window.location.href='tel:${CONTACT.phone}';}}catch(err){}})( event);">
      <div class="ic">${ICONS.phoneIcon}</div><div class="lt">${CONTACT.phone_display}</div><div class="chev">${ICONS.chev}</div>
    </a>
    <div class="link-row" style="cursor:pointer" onclick="try{Telegram.WebApp.openTelegramLink('https://t.me/${CONTACT.tg}');}catch(e){window.open('https://t.me/${CONTACT.tg}','_blank');}">
      <div class="ic">${ICONS.tg}</div><div class="lt">@${CONTACT.tg}</div><div class="chev">${ICONS.chev}</div>
    </div>
    <button class="btn btn-ghost" style="margin-top:18px;" onclick="closeSheet()">${tx('close_btn')}</button>`);
}

/* =================== REQUESTS =================== */
function _buildRequestsSheet(){
  const ORDER=['pending','approved','shipping','confirmed','delivered'];
  const rows = REQUESTS.map(r=>`
    <div class="req-item" style="flex-wrap:wrap;gap:6px">
      <div class="ic">${ICONS.gift}</div>
      <div class="ri"><div class="t">${r.name}</div><div class="s">${r.statusText}</div></div>
      <span class="pill ${r.pill}">${r.statusText}</span>
      ${r.rawStatus==='confirmed'?`<button class="btn btn-primary" style="width:100%;margin-top:4px;font-size:13px" onclick="clientConfirmGift(${r.id})">✅ ${USER.lang==='uz'?"Qabul qilishni tasdiqlash":'Подтвердить получение'}</button>`:''}
    </div>`).join('');
  const latest=REQUESTS.find(r=>r.rawStatus!=='rejected');
  const cur=latest?ORDER.indexOf(latest.rawStatus):-1;
  const steps=[tx('step1'),tx('step2'),tx('step3'),tx('step4'),tx('step5')];
  const stepper=`<div class="steps">${steps.map((s,i)=>{
    const cls=i<cur?'done':i===cur?'active':'';
    return `<div class="step ${cls}">${i<steps.length-1?'<div class="step-line"></div>':''}<div class="sn">${i+1}</div><div class="stxt">${s}</div></div>`;
  }).join('')}</div>`;
  openSheet(`
    <h3 style="margin-bottom:4px;">${tx('my_reqs')}</h3>
    <p class="sheet-sub" style="margin-bottom:6px;">${tx('my_reqs_sub')}</p>
    ${stepper}
    <div class="block" style="margin-top:8px;box-shadow:none;border:1px solid var(--border);">${rows||`<div style="padding:16px;text-align:center;color:var(--muted)">${tx('no_requests')||'Нет заявок'}</div>`}</div>
    <button class="btn btn-ghost" onclick="closeSheet()">${tx('close_btn')}</button>`);
}

async function openRequests(){
  // Всегда грузим свежие данные перед показом
  if(_tgInitData||_tgUserId){
    try{
      const data=await apiFetch('/api/gift-requests');
      REQUESTS_RAW=data;USER.requests=data.length;reprocessData();
    }catch(e){}
  }
  _buildRequestsSheet();
}

async function clientConfirmGift(reqId){
  try{
    await apiFetch(`/api/gift-requests/${reqId}/client-confirm`,{method:'POST'});
    haptic('success');
    await loadRequests();
    reprocessData();
    openRequests();
  }catch(e){
    alert(e.message||'Ошибка');
  }
}

/* =================== LANG =================== */
function setLang(l){
  USER.lang=l; haptic('light');
  reprocessData();
  renderHome();renderGifts();renderHistory();renderCatalog();renderProfile();renderTabbar();
  if(_tgInitData||_tgUserId){
    apiFetch('/api/me/language',{method:'PUT',body:JSON.stringify({language:l})}).catch(()=>{});
  }
}

/* =================== SPEND via API =================== */
async function doSpendApi(amount){
  if(!_tgInitData&&!_tgUserId) return false;
  try{
    const r=await apiFetch('/api/cashback-spend',{method:'POST',body:JSON.stringify({amount})});
    USER.balance=r.cashback_balance||0;
    return true;
  }catch(e){return false;}
}
// Override spendSuccess to use API
const _origSpendSuccess=typeof spendSuccess!=='undefined'?spendSuccess:null;
window.spendSuccess=async function(){
  const confirmBtn=document.querySelector('#sheet .btn.btn-primary');
  if(confirmBtn){if(confirmBtn.dataset.loading)return;confirmBtn.dataset.loading='1';confirmBtn.disabled=true;confirmBtn.textContent='...';}
  haptic('heavy');
  try{Telegram.WebApp.HapticFeedback.notificationOccurred('success');}catch(e){}
  const ok=await doSpendApi(spendAmount);
  if(!ok){
    if(confirmBtn){confirmBtn.disabled=false;delete confirmBtn.dataset.loading;confirmBtn.textContent=tx('confirm_spend');}
    openSheet(`<div class="sheet-ic" style="background:#fee2e2">⚠️</div>
      <h3>Ошибка</h3>
      <p class="sheet-sub">Не удалось списать кешбэк. Попробуйте ещё раз.</p>
      <button class="btn btn-ghost" onclick="closeSheet()">${tx('close_btn')}</button>`);
    return;
  }
  // Обновляем фоновые экраны сразу — до закрытия шторки любым способом
  try{renderHome();renderGifts();renderProfile();}catch(e){}
  const colors=['#16A34A','#2E7BD6','#0E37A3','#F59E0B','#EC4899','#22C55E'];
  let bursts='';
  for(let i=0;i<10;i++){
    const ang=(Math.PI*2/10)*i, dist=46+Math.random()*22;
    bursts+=`<span class="burst" style="--bx:${Math.cos(ang)*dist}px;--by:${Math.sin(ang)*dist}px;background:${colors[i%colors.length]};"></span>`;
  }
  $('#sheet').innerHTML=`<div class="handle"></div>
    <div class="success-wrap">
      <div class="sc-ring"></div>
      <div class="sc-circle"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg></div>
      ${bursts}
    </div>
    <h3>${tx('done_title')}</h3>
    <p class="sheet-sub">${tx('spend_confirmed')}</p>
    <div class="big-amount">${fmt(spendAmount)}<span>сум</span></div>
    <p class="sheet-text" style="text-align:center;">${tx('show_to_agent')}</p>
    <button class="btn btn-primary" onclick="closeSheet();renderHome();renderGifts();renderProfile()">${tx('done_btn')}</button>`;
};

/* =================== GIFT REQUEST via API =================== */
window.giftRequest=async function(name, giftId){
  haptic('medium');
  try{Telegram.WebApp.HapticFeedback.notificationOccurred('success');}catch(e){}
  closeSheet();
  if(giftId && (_tgInitData||_tgUserId)){
    try{ await apiFetch('/api/gift-requests',{method:'POST',body:JSON.stringify({gift_id:giftId})}); }catch(e){}
    await loadRequests(); await loadUserData();
    renderHome(); renderGifts(); renderProfile();
  }
  setTimeout(()=>openSheet(`
    <div class="success-wrap">
      <div class="sc-ring"></div>
      <div class="sc-circle"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg></div>
    </div>
    <h3>${tx('request_sent')}</h3>
    <p class="sheet-text" style="text-align:center;">«${name}» ${tx('request_sent_text')}</p>
    <button class="btn btn-primary" onclick="closeSheet()">${tx('done_btn')}</button>`),250);
};

/* =================== INIT =================== */
async function init(){
  try{
    const tg = Telegram.WebApp;
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#EDF1F7');
    tg.setBackgroundColor && tg.setBackgroundColor('#EDF1F7');
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if(u){
      const fn=u.first_name||'', ln=u.last_name||'';
      if(fn){USER.name=(fn+' '+ln).trim();USER.initials=((fn[0]||'')+(ln[0]||'')).toUpperCase();}
      if(u.username)USER.tgId='@'+u.username;
    }
  }catch(e){}

  // Первичный рендер со статическими данными (сразу)
  renderHome();renderGifts();renderHistory();renderCatalog();renderProfile();renderTabbar();

  // Подгружаем настройки (контакты) до рендера
  await loadSettings();

  // Подгружаем реальные данные из API
  const hasApi = await loadUserData();
  if(hasApi){
    await Promise.all([loadGifts(), loadHistory(), loadRequests(), loadCatalog()]);
    renderHome();renderGifts();renderHistory();renderCatalog();renderProfile();
  }

  // Открыть нужный таб если задан хэш в URL (#gifts, #history и т.д.)
  const _hash = (window.location.hash||'').replace('#','');
  if(_hash && ['gifts','history','catalog','profile'].includes(_hash)) switchTab(_hash);
}
init();

// Обновляем данные когда пользователь возвращается в апп (свернул → открыл)
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden) {
    const ok = await loadUserData();
    if (ok) {
      await Promise.all([loadGifts(), loadHistory(), loadRequests()]);
      renderHome(); renderGifts(); renderHistory(); renderProfile();
    }
  }
});
</script>
